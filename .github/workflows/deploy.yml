# Build, test, publish — then hand over to ArgoCD.
#
# The workflow never touches the cluster. It commits a new image tag to the
# STAGING overlay and Argo reconciles, so the repository always states what is
# running and a rollback is `git revert`.
#
# A push to main reaches eesoc.raphsinai.dev and stops there. eesoc.com moves
# only when somebody runs promote.yml, which copies the SHA staging is already
# running into the production overlay — the same image, not a rebuild, so what
# goes live is the artifact that was actually tested.

name: build and deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  # Deliberately NOT ${{ github.repository_owner }} directly: a Docker
  # repository name must be lowercase, and a GitHub username keeps whatever
  # case it was registered with ("Raphsinai"), which buildx rejects outright.
  # Expressions have no lowercase function, so each job derives it in a step.
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the env files CI needs
        run: |
          cp .env.example .env
          cp backend.env.example backend.env

      - name: Bring the stack up
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/api/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      # Migrations run on adapter startup. Asserting the recorded count catches
      # a migration that failed to apply, which would otherwise only surface as
      # a confusing 500 much later.
      - name: Assert migrations applied
        run: |
          # Every migration in the directory must be recorded — not a hardcoded
          # minimum, which silently stops testing anything the moment a
          # migration is added.
          #
          # Polled, because /health answering says the *api* is up while the
          # database service may still be applying. A single check here caught
          # 14 of 26 and failed a run for no reason.
          EXPECTED=$(ls backend/database/migrations/*.sql | wc -l | tr -d ' ')
          for i in $(seq 1 40); do
            COUNT=$(docker compose exec -T postgres \
              psql -U eesoc -d eesoc -tAc "SELECT COUNT(*) FROM migrations;" \
              2>/dev/null | tr -d ' \r' || echo 0)
            [ -z "$COUNT" ] && COUNT=0
            echo "migrations applied: $COUNT / $EXPECTED"
            [ "$COUNT" -ge "$EXPECTED" ] && exit 0
            sleep 3
          done
          echo "::error::only $COUNT of $EXPECTED migrations applied"
          docker compose logs database --tail 60
          exit 1

      - name: Wait for resource seeding
        run: |
          for i in $(seq 1 40); do
            COUNT=$(curl -sf localhost:8080/api/resources \
              | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["pages"]))' 2>/dev/null || echo 0)
            if [ "$COUNT" -ge 10 ]; then echo "seeded $COUNT pages"; exit 0; fi
            sleep 3
          done
          echo "::error::Resource seeding did not complete"
          docker compose logs api
          exit 1

      - name: Smoke check the public surface
        run: |
          set -euo pipefail
          curl -sf localhost:8080/              > /dev/null
          curl -sf localhost:8080/api/events    > /dev/null
          curl -sf localhost:8080/api/resources > /dev/null
          curl -sf localhost:8080/sitemap.xml   | grep -q "<urlset"
          curl -sf localhost:8080/robots.txt    | grep -q "Sitemap:"

      # The bypass must never reach a built image's default configuration.
      - name: Assert dev login is off by default
        run: |
          ! grep -qE '^\s*dev_login_enabled:\s*bool\s*=\s*True' backend/api/config.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # Renders both overlays and checks they stay separate. Without this a broken
  # patch target or a hostname in the wrong overlay is only discovered by
  # ArgoCD, mid-sync, against a live environment.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sfLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          rm kustomize.tar.gz

      - name: Render both overlays
        run: |
          kustomize build deploy/k8s/overlays/production > production.yaml
          kustomize build deploy/k8s/overlays/staging    > staging.yaml

      - name: The two environments must not overlap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml

          def load(path):
              return [d for d in yaml.safe_load_all(open(path)) if d]

          def hosts(docs):
              return {
                  r.get("host")
                  for d in docs if d["kind"] == "Ingress"
                  for r in (d["spec"].get("rules") or [])
              }

          def namespaces(docs):
              return {
                  d["metadata"]["name"] if d["kind"] == "Namespace"
                  else d["metadata"].get("namespace")
                  for d in docs
              } - {None}

          prod, stage = load("production.yaml"), load("staging.yaml")
          fail = []

          # A host in both renders means both Ingresses claim the name and the
          # controller picks one — a coin toss over which environment answers.
          shared_hosts = hosts(prod) & hosts(stage)
          if shared_hosts:
              fail.append(f"host served by both environments: {shared_hosts}")

          shared_ns = namespaces(prod) & namespaces(stage)
          if shared_ns:
              fail.append(f"namespace shared by both environments: {shared_ns}")

          # Catches the overlay patch being dropped: staging would then inherit
          # production's values and quietly send testers to eesoc.com.
          for docs, name, expect in ((prod, "production", "https://eesoc.com"),
                                     (stage, "staging", "https://eesoc.raphsinai.dev")):
              cfg = next(d for d in docs
                         if d["kind"] == "ConfigMap" and d["metadata"]["name"] == "eesoc-config")
              got = cfg["data"]["SITE_ORIGIN"]
              if got != expect:
                  fail.append(f"{name} SITE_ORIGIN is {got}, expected {expect}")
              if cfg["data"]["DEV_LOGIN_ENABLED"] != "false":
                  fail.append(f"{name} has the dev login bypass enabled")

          # Empty rules in the base are the fail-safe; an overlay that renders
          # with none of its own is an environment serving nothing.
          for docs, name in ((prod, "production"), (stage, "staging")):
              if not hosts(docs):
                  fail.append(f"{name} renders no Ingress hosts")

          # The refresh job issues DROP SCHEMA. It belongs in staging and
          # nowhere else; rendered into production it would destroy the live
          # database on the next sync. restore.sh refuses to run outside the
          # staging namespace, but that is the last line of defence, not the
          # first — this is the first.
          def names(docs, kind):
              return {d["metadata"]["name"] for d in docs if d["kind"] == kind}

          if "refresh-from-production" in names(prod, "Job"):
              fail.append("the staging refresh job renders into PRODUCTION — "
                          "it would DROP SCHEMA on the live database")

          # And the reverse: the snapshot reads real data, so it runs only
          # where the real data is.
          if "snapshot" in names(stage, "CronJob"):
              fail.append("the production snapshot CronJob renders into staging")

          if "refresh-from-production" not in names(stage, "Job"):
              fail.append("staging has no refresh job; it will not track production")

          for f in fail:
              print(f"::error::{f}")
          sys.exit(1 if fail else 0)
          PY

  # Pytest suite (api + database adapter) against the compose TEST stack —
  # the real services with the ICU bridge swapped for a stub and mail pointed
  # at mailpit. CI must make zero calls to eActivities (the API is rate-limited
  # per source IP and a breach bans the whole society), which is why the
  # service list names every service explicitly and never includes `union`.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the env files CI needs
        run: |
          cp .env.example .env
          cp backend.env.example backend.env

      - name: Bring the test stack up
        run: >
          docker compose -f docker-compose.yml -f docker-compose.test.yml
          -p eesoc-test up -d --build
          postgres database union-stub mailpit api api-nologin frontend

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/api/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test logs
          exit 1

      # No service in the test stack may hold a real ICU key: the eActivities
      # API is rate-limited per source IP and a breach bans the whole society,
      # CI included. The union stub has no env_file at all, and the test
      # override blanks ICU_API_KEY on the two api services (whose env_file
      # is a copy of backend.env.example in CI); this assert fails the job
      # before a single test runs if that ever stops being true.
      - name: Assert no test service holds an ICU key
        run: |
          set -euo pipefail
          for svc in union-stub api api-nologin; do
            docker compose -f docker-compose.yml -f docker-compose.test.yml \
              -p eesoc-test exec -T "$svc" \
              sh -c 'test -z "${ICU_API_KEY:-}"' \
              || { echo "::error::ICU_API_KEY is set on $svc"; exit 1; }
            echo "$svc: no ICU key"
          done

      - name: Wait for resource seeding
        run: |
          for i in $(seq 1 40); do
            COUNT=$(curl -sf localhost:8080/api/resources \
              | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["pages"]))' 2>/dev/null || echo 0)
            if [ "$COUNT" -ge 10 ]; then echo "seeded $COUNT pages"; exit 0; fi
            sleep 3
          done
          echo "::error::Resource seeding did not complete"
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test logs api
          exit 1

      - name: Install the test dependencies
        run: pip install -r backend/api/requirements-dev.txt

      - name: Run the pytest suites
        run: python3 -m pytest tests -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test logs --tail 200

      - name: Tear the test stack down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test down -v

  # Playwright suite, against the same test stack. The api the browser talks
  # to is the compose one (no dev server), so the specs exercise exactly what
  # a deploy will serve.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the env files CI needs
        run: |
          cp .env.example .env
          cp backend.env.example backend.env

      - name: Bring the test stack up
        run: >
          docker compose -f docker-compose.yml -f docker-compose.test.yml
          -p eesoc-test up -d --build
          postgres database union-stub mailpit api api-nologin frontend

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/api/health >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test logs
          exit 1

      # Same guard as the pytest job, for the same reason, and it stays in
      # both jobs because each must be safe to re-run alone.
      - name: Assert no test service holds an ICU key
        run: |
          set -euo pipefail
          for svc in union-stub api api-nologin; do
            docker compose -f docker-compose.yml -f docker-compose.test.yml \
              -p eesoc-test exec -T "$svc" \
              sh -c 'test -z "${ICU_API_KEY:-}"' \
              || { echo "::error::ICU_API_KEY is set on $svc"; exit 1; }
            echo "$svc: no ICU key"
          done

      - name: Wait for resource seeding
        run: |
          for i in $(seq 1 40); do
            COUNT=$(curl -sf localhost:8080/api/resources \
              | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["pages"]))' 2>/dev/null || echo 0)
            if [ "$COUNT" -ge 10 ]; then echo "seeded $COUNT pages"; exit 0; fi
            sleep 3
          done
          echo "::error::Resource seeding did not complete"
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test logs api
          exit 1

      # npm ci at the repo root, not in frontend/: the specs live in tests/e2e,
      # outside the frontend package, and Node resolves @playwright/test by
      # walking up from the spec file — so the install has to sit at the root
      # (see the root package.json). The config stays in frontend/.
      - name: Install the e2e dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run the e2e suites
        run: npx playwright test --config frontend/playwright.config.js

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results

      - name: Tear the test stack down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test down -v

  build:
    needs: [test, manifests, pytest, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: backend/api }
          - { name: database, context: backend/database }
          - { name: union, context: backend/union }
          - { name: frontend, context: frontend }
          - { name: garage-init, context: deploy/garage-init }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner for the registry
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Tagged by commit SHA as well as latest. Deployments pin the SHA:
          # a moving tag makes it impossible to say what is running, and breaks
          # rollback.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/eesoc-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/eesoc-${{ matrix.name }}:latest
          # No VITE_SITE_ORIGIN. One image has to serve both environments
          # for promotion to mean anything, so the public origin is read from
          # the browser at runtime (frontend/src/seo.js) rather than baked in.
          # It was never doing anything anyway: frontend/Dockerfile declares no
          # such ARG, so buildx dropped it and the hardcoded fallback won.
          build-args: |
            VITE_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging. Production is promote.yml, by hand.
  release-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sfLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          rm kustomize.tar.gz

      - name: Lowercase the owner for the registry
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"

      # The staging overlay, never the base: the base is shared, so a tag there
      # would reach production on the same sync and there would be nothing left
      # to promote.
      - name: Pin the new image tags in staging
        working-directory: deploy/k8s/overlays/staging
        run: |
          for svc in api database union frontend garage-init; do
            kustomize edit set image \
              "ghcr.io/OWNER/eesoc-${svc}=${{ env.REGISTRY }}/${{ env.OWNER_LC }}/eesoc-${svc}:${{ github.sha }}"
          done

      - name: Commit for ArgoCD to pick up
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/staging/kustomization.yaml
          # [skip ci] stops this commit from triggering the workflow again.
          git diff --staged --quiet || \
            git commit -m "staging: ${{ github.sha }} [skip ci]"
          # The other workflow (staging pin / promote) can push to main in the
          # same minute, which rejected this push and left staging unpinned
          # twice on 2026-10-06. Each edits a different overlay file, so a
          # rebase onto the winner never conflicts.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            sleep $((attempt * 3))
            git pull --rebase origin main
          done
          exit 1

      - name: Say what to do next
        run: |
          {
            echo "### Deployed to staging"
            echo
            echo "<https://eesoc.raphsinai.dev> is now running \`${GITHUB_SHA:0:8}\`."
            echo
            echo "Check it, then run the **promote** workflow to put the same"
            echo "images on <https://eesoc.com>."
          } >> "$GITHUB_STEP_SUMMARY"
