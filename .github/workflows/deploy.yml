# Check, publish all six images, then update staging GitOps on main pushes.
# Manual builds of older main commits only build images; production stays manual.
name: CI — checks and images
run-name: "CI ${{ inputs.target_sha || github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional full commit SHA on main to test/build (for sequential staging)'
        required: false
        type: string

# Only the latest commit on a branch needs the expensive tests/image jobs.
# Manual historical builds are independent and are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    timeout-minutes: 75
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      previous_sha: ${{ steps.source.outputs.previous_sha }}
    steps:
      # The persistent runner previously accumulated root-owned .pyc files.
      - name: Reclaim checkout directory
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Validate build commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            [ -z "$REQUESTED_SHA" ] || [[ "$REQUESTED_SHA" =~ ^[[:xdigit:]]{40}$ ]] || { echo '::error::Use a full commit SHA'; exit 1; }
            git fetch -q origin main
            git merge-base --is-ancestor "$sha" origin/main || { echo '::error::Commit is not on main'; exit 1; }
          fi
          # Use the image actually deployed to staging, not main's stale pin.
          # This preserves recent frontend assets for tabs open during rollout.
          git fetch -q origin staging-deploy
          previous_sha=$(git show origin/staging-deploy:deploy/k8s/overlays/staging/kustomization.yaml | awk '$1 == "newTag:" {print $2; exit}')
          [[ "$previous_sha" =~ ^[[:xdigit:]]{40}$ ]] || { echo '::error::Staging image pin must be a full SHA'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/api/requirements.txt
            backend/api/requirements-dev.txt
            backend/database/requirements.txt
      - name: Install test dependencies
        run: python3 -m pip install -r backend/api/requirements-dev.txt -r backend/database/requirements.txt

      - name: Validate staging and production manifests
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/kustomize.tar.gz" 'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          "$RUNNER_TEMP/kustomize" build deploy/k8s/overlays/production > production.yaml
          "$RUNNER_TEMP/kustomize" build deploy/k8s/overlays/staging > staging.yaml
          python3 scripts/check-deployment-overlays.py

      - name: Start isolated API test stack (never the real Union API)
        run: |
          cp .env.example .env
          cp backend.env.example backend.env
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test down -v --remove-orphans
          # Both api instances use the SAME image/tag; build it only once.
          # Keep the local Docker layer cache on the persistent test runner.
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test build database union-stub api frontend
          docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test up -d --no-build postgres database union-stub mailpit api api-nologin frontend
      - name: Wait for API and verify critical endpoints
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS localhost:8080/api/health > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS localhost:8080/api/health > /dev/null
          for svc in union-stub api api-nologin; do
            docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test exec -T "$svc" sh -c 'test -z "${ICU_API_KEY:-}"'
          done
          for i in $(seq 1 40); do
            count=$(curl -fsS localhost:8080/api/resources | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["pages"]))' 2>/dev/null || echo 0)
            [ "$count" -ge 10 ] && break
            sleep 3
          done
          [ "$count" -ge 10 ] || { echo '::error::Resource seeding failed'; exit 1; }
          curl -fsS localhost:8080/ > /dev/null
          curl -fsS localhost:8080/api/events > /dev/null
          curl -fsS localhost:8080/sitemap.xml | grep -q '<urlset'
          curl -fsS localhost:8080/robots.txt | grep -q 'Sitemap:'
          ! grep -qE '^\s*dev_login_enabled:\s*bool\s*=\s*True' backend/api/config.py
      - name: Run all Python regression tests (including migration safety)
        run: python3 -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Playwright Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Run browser regression tests against the same isolated stack
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config frontend/playwright.config.js
      - name: Browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test logs --tail 100
      - name: Clean up test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p eesoc-test down -v --remove-orphans

  images:
    # Every required check must pass. No image is published on a failed run.
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, context: backend/api }
          - { name: database, context: backend/database }
          - { name: union, context: backend/union }
          - { name: frontend, context: frontend }
          - { name: garage-init, context: deploy/garage-init }
          - { name: whatsapp, context: backend/whatsapp }
    steps:
      - name: Reclaim checkout directory
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to diff the entire Docker context against staging.
          ref: ${{ needs.checks.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalise GHCR owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      - name: Find cached image for unchanged Docker context
        id: image-plan
        env:
          RELEASE_SHA: ${{ needs.checks.outputs.sha }}
          PREVIOUS_SHA: ${{ needs.checks.outputs.previous_sha }}
          BUILD_CONTEXT: ${{ matrix.context }}
          IMAGE_NAME: ${{ matrix.name }}
        run: bash scripts/ci-image-plan.sh
      - name: Reuse existing immutable image without rebuilding
        if: steps.image-plan.outputs.mode != 'build'
        env:
          SOURCE: ${{ steps.image-plan.outputs.source }}
          TARGET: ${{ steps.image-plan.outputs.target }}
          LATEST: ${{ steps.image-plan.outputs.latest }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "$TARGET" ]; then
            echo 'Exact source image already exists; skipping duplicate build.'
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              docker buildx imagetools create -t "$LATEST" "$TARGET"
            fi
          else
            tags=(-t "$TARGET")
            if [ "$GITHUB_EVENT_NAME" = push ]; then tags+=(-t "$LATEST"); fi
            docker buildx imagetools create "${tags[@]}" "$SOURCE"
          fi
          docker buildx imagetools inspect "$TARGET" > /dev/null
      - name: Build and publish changed image
        if: steps.image-plan.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/eesoc-${{ matrix.name }}:${{ needs.checks.outputs.sha }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/eesoc-{1}:latest', env.OWNER_LC, matrix.name) || '' }}
          build-args: |
            VITE_API_BASE=/api
            PREVIOUS_FRONTEND_IMAGE=ghcr.io/${{ env.OWNER_LC }}/eesoc-frontend:${{ needs.checks.outputs.previous_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  release-staging:
    # A push to main automatically stages only after checks and ALL six images
    # have succeeded. PRs and manual historic-image builds never deploy.
    needs: [checks, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    environment: staging
    concurrency:
      group: eesoc-staging-feature
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Reclaim checkout directory
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.checks.outputs.sha }}
      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/kustomize.tar.gz" 'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
      - name: Publish checked images to staging GitOps
        env:
          RELEASE_SHA: ${{ needs.checks.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected a full source SHA'; exit 1; }
          owner_lc=${OWNER,,}
          overlay=deploy/k8s/overlays/staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The manual staging workflows can update this same ref. Re-read it
          # and retry a conflicting push rather than overwriting their release.
          for attempt in 1 2 3; do
            git fetch -q origin main staging-deploy
            git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
              echo '::error::Source commit is no longer on main'; exit 1;
            }
            before=$(git rev-parse origin/staging-deploy)
            staged=$(git show "origin/staging-deploy:$overlay/kustomization.yaml")
            tag_count=$(printf '%s\n' "$staged" | awk '$1 == "newTag:" {n++} END {print n+0}')
            [ "$tag_count" -eq 6 ] || { echo '::error::Expected exactly six staged image pins'; exit 1; }
            tags=$(printf '%s\n' "$staged" | awk '$1 == "newTag:" {print $2}' | sort -u)
            [ "$(printf '%s\n' "$tags" | wc -l)" -eq 1 ] || {
              echo '::error::Staging has mixed image tags; refusing to overwrite'; exit 1;
            }
            pinned=$tags
            [[ "$pinned" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid staged image SHA'; exit 1; }

            if git merge-base --is-ancestor "$RELEASE_SHA" "$pinned"; then
              echo "Staging already has $pinned (this release or a newer one); no rollback."
              exit 0
            fi
            git merge-base --is-ancestor "$pinned" "$RELEASE_SHA" || {
              echo '::error::Staging has diverged from this source commit'; exit 1;
            }

            # Stage the exact source that passed CI, not the main branch after
            # another push. Only the staging overlay's tags are changed.
            git switch -C staging-deploy "$RELEASE_SHA"
            for service in api database union frontend garage-init whatsapp; do
              (cd "$overlay" && "$RUNNER_TEMP/kustomize" edit set image "ghcr.io/OWNER/eesoc-${service}=ghcr.io/${owner_lc}/eesoc-${service}:${RELEASE_SHA}")
            done
            "$RUNNER_TEMP/kustomize" build "$overlay" > /dev/null
            git add "$overlay/kustomization.yaml"
            if ! git diff --cached --quiet; then
              git commit -m "staging: deploy checked $RELEASE_SHA [skip ci]"
            fi
            if git push --force-with-lease="refs/heads/staging-deploy:$before" origin HEAD:refs/heads/staging-deploy; then
              {
                echo '### Automatically published staging release'
                echo "- Source commit: $RELEASE_SHA"
                echo '- All checks and six image builds succeeded.'
                echo '- ArgoCD follows `staging-deploy`; production is unchanged.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Staging changed during attempt $attempt; retrying safely."
          done
          echo '::error::Staging was updated concurrently three times; release needs review.'
          exit 1
