# Temporary bypass while the permanent CI pipeline is being repaired.
# One-click staging release from main: build, publish, then update ONLY staging.
# No tests, approvals, production changes, or additional workflow inputs.
name: Deploy staging manually (temporary)
run-name: "Manual staging deploy ${{ github.sha }}"

on:
  workflow_dispatch:

concurrency:
  group: eesoc-temporary-staging-release
  cancel-in-progress: false

permissions:
  contents: write  # move only the staging-deploy branch
  packages: write  # publish immutable images to GHCR

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    timeout-minutes: 90
    steps:
      - name: Reclaim persistent runner checkout
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact release and currently staged frontend
        id: release
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch -q origin main staging-deploy
          [ "$sha" = "$(git rev-parse origin/main)" ] || {
            echo '::error::Main moved; trigger the workflow again for the latest commit.'; exit 1;
          }
          previous=$(git show origin/staging-deploy:deploy/k8s/overlays/staging/kustomization.yaml | awk '/newTag:/ {print $2; exit}')
          [[ "$previous" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Staging has no valid prior image pin'; exit 1; }
          git merge-base --is-ancestor "$previous" "$sha" || {
            echo '::error::Staging pin is not an ancestor of main; manual review required'; exit 1;
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish six images
        env:
          SHA: ${{ steps.release.outputs.sha }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=${OWNER,,}
          for service in garage-init api database union whatsapp frontend; do
            case "$service" in
              garage-init) context=deploy/garage-init ;;
              api) context=backend/api ;;
              database) context=backend/database ;;
              union) context=backend/union ;;
              whatsapp) context=backend/whatsapp ;;
              frontend) context=frontend ;;
            esac
            image="ghcr.io/$owner/eesoc-$service:$SHA"
            echo "::group::Build and push $image"
            docker buildx build --platform linux/amd64 --progress=plain --push \
              --build-arg VITE_API_BASE=/api \
              --build-arg "PREVIOUS_FRONTEND_IMAGE=ghcr.io/$owner/eesoc-frontend:$PREVIOUS" \
              --tag "$image" "$context"
            docker buildx imagetools inspect "$image" > /dev/null
            echo "::endgroup::"
            echo "- Published and verified $image" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Update staging GitOps branch after all images succeed
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          # Reset the staging release branch to current main, then pin the six
          # images. The force-with-lease only touches this staging-specific ref;
          # branch protections and the production/main branch remain intact.
          before=$(git rev-parse origin/staging-deploy)
          git switch -C staging-deploy "$SHA"
          python3 - "$SHA" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path('deploy/k8s/overlays/staging/kustomization.yaml')
          content = path.read_text()
          for service in ('api', 'database', 'frontend', 'garage-init', 'union', 'whatsapp'):
              pattern = rf'(?m)(- name: ghcr\.io/OWNER/eesoc-{service}\n  newName: ghcr\.io/raphsinai/eesoc-{service}\n  newTag: )[a-f0-9]{{40}}'
              content, count = re.subn(pattern, lambda m: m.group(1) + sys.argv[1], content)
              if count != 1:
                  raise SystemExit(f'::error::Expected one staging pin for {service}, got {count}')
          path.write_text(content)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/k8s/overlays/staging/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "staging: deploy $SHA [skip ci]"
          fi
          git push --force-with-lease="refs/heads/staging-deploy:$before" origin HEAD:refs/heads/staging-deploy
          echo "### Staging release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- ArgoCD automatically syncs the `staging-deploy` branch; production is unchanged.' >> "$GITHUB_STEP_SUMMARY"
