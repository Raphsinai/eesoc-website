# Promote to production: whole staging release or an isolated frontend-only release.
#
# Whole release copies the image tags that
# eesoc.raphsinai.dev is already running into the production overlay and commits
# — the identical images, never a rebuild, so what goes live is the artifact
# that was actually tested rather than a fresh build of the same source that
# might resolve a dependency differently.
#
# Like the deploy workflow, it never touches the cluster: ArgoCD notices the
# commit. A rollback is `git revert` of that commit, or running this again with
# an older SHA.

name: promote to production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full staging promotion, or an isolated frontend-only release
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend-only
      source_sha:
        description: "frontend-only: full commit SHA from a release/* branch based on the current production frontend source"
        required: false
        type: string
      approved_paths:
        description: "frontend-only: exact comma-separated files changed from production, e.g. frontend/src/views/LockersView.vue"
        required: false
        type: string
      test_spec:
        description: "frontend-only: a Playwright spec from main, e.g. tests/e2e/lockers/union-shop-link.spec.js"
        required: false
        type: string
      sha:
        description: >-
          Commit SHA to promote. Leave blank to promote whatever staging is
          currently running, which is almost always what you want.
        required: false
        type: string

# All production promotions (full or selective) run one at a time.
concurrency:
  group: eesoc-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.mode == 'all'
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    # Attach required reviewers to this environment in repository settings if
    # production should need a second pair of eyes. With none configured it
    # simply runs, so the workflow works either way.
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the ancestry check below can see the SHA.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python3 -m pip install PyYAML==6.0.2

      - name: Work out what to promote
        id: pick
        run: |
          set -euo pipefail
          # Staging currently follows staging-deploy, not main's old staging pin.
          git fetch -q origin staging-deploy
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, yaml, subprocess

          SERVICES = ["api", "database", "union", "frontend", "garage-init", "whatsapp"]

          def tags(path, new_ok=False, staging_branch=False):
              if staging_branch:
                  raw = subprocess.check_output(
                      ["git", "show", f"origin/staging-deploy:{path}"], text=True
                  )
              else:
                  with open(path) as source:
                      raw = source.read()
              doc = yaml.safe_load(raw) or {}
              pinned = {i["name"]: i.get("newTag") for i in doc.get("images", [])}
              out = {}
              for svc in SERVICES:
                  tag = pinned.get(f"ghcr.io/OWNER/eesoc-{svc}")
                  if not tag and not new_ok:
                      sys.exit(f"::error::no pinned tag for eesoc-{svc} in {path}")
                  out[svc] = tag
              return out

          staging = tags("deploy/k8s/overlays/staging/kustomization.yaml", staging_branch=True)
          # A service added since the last promote has no pin in production
          # yet; this promote is what gives it one. (Pinned is not running:
          # whatsapp runs only where an overlay includes its component.)
          production = tags("deploy/k8s/overlays/production/kustomization.yaml", new_ok=True)

          # All six services are built from one commit and pinned together. A
          # mismatch means a half-finished deploy, and promoting it would put a
          # combination on eesoc.com that has never run anywhere.
          if len(set(staging.values())) != 1:
              sys.exit(f"::error::staging is on mixed tags, refusing: {staging}")

          wanted = os.environ.get("INPUT_SHA", "").strip() or staging["api"]
          if wanted != staging["api"]:
              sys.exit(f"::error::requested SHA is not the current staging release: {wanted} != {staging['api']}")

          if len(set(production.values())) == 1 and production["api"] == wanted:
              sys.exit(f"::error::production is already on {wanted}; nothing to promote")

          print(f"sha={wanted}")
          print(f"from={production['api']}")
          print(f"staging={staging['api']}")
          PY
        env:
          INPUT_SHA: ${{ inputs.sha }}

      # A tag that is not on main is a tag nobody can find their way back to.
      # This also catches a typo in the manual SHA input, which would otherwise
      # commit an image reference that does not exist and leave production in
      # ImagePullBackOff.
      - name: Check the commit is on main
        run: |
          git merge-base --is-ancestor "${{ steps.pick.outputs.sha }}" origin/main \
            || { echo "::error::${{ steps.pick.outputs.sha }} is not an ancestor of main"; exit 1; }

      - name: Install kustomize
        run: |
          curl -sfLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          rm kustomize.tar.gz

      - name: Lowercase the owner for the registry
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Pin the promoted tags in production
        working-directory: deploy/k8s/overlays/production
        run: |
          for svc in api database union frontend garage-init whatsapp; do
            kustomize edit set image \
              "ghcr.io/OWNER/eesoc-${svc}=ghcr.io/${{ env.OWNER_LC }}/eesoc-${svc}:${{ steps.pick.outputs.sha }}"
          done

      # Renders both overlays before committing. A manifest that does not build
      # would otherwise be caught by ArgoCD mid-sync, with production already
      # part-applied.
      - name: Check both overlays still render
        run: |
          kustomize build deploy/k8s/overlays/production > /dev/null
          kustomize build deploy/k8s/overlays/staging    > /dev/null

      # GitHub protects main against direct workflow pushes. Publish a release
      # PR instead; an authorised maintainer merges it to trigger production ArgoCD.
      - name: Prepare production promotion PR (protected main)
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_SHA: ${{ steps.pick.outputs.sha }}
          FROM_SHA: ${{ steps.pick.outputs.from }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="release/production-${PROMOTE_SHA:0:12}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add deploy/k8s/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo '::error::Production image pins did not change'
            exit 1
          fi
          git commit -m "promote: $PROMOTE_SHA to production [skip ci]"
          git push origin HEAD:"refs/heads/$branch"

          # A GitHub Actions token cannot bypass the protected main ruleset.
          # Create a PR, then a maintainer explicitly merges it. The action
          # only writes the image pin, never alters production configuration.
          export BRANCH="$branch"
          python3 - <<'PY' > "$RUNNER_TEMP/promotion-pr.json"
          import json, os
          sha = os.environ['PROMOTE_SHA']
          print(json.dumps({
              'title': f'Promote staging {sha[:12]} to production',
              'head': os.environ['BRANCH'],
              'base': 'main',
              'body': (
                  f'Production release prepared by GitHub Actions.\n\n'
                  f'Source: staging-deploy, six matching image tags `{sha}`.\n'
                  f'Previous production tag: `{os.environ["FROM_SHA"]}`.\n'
                  'Only production overlay image pins change. No image rebuild.\n'
                  'Merge this PR to make production ArgoCD deploy. '
                  'Check the production API and all deployments afterwards.'
              ),
          }))
          PY
          status=$(curl -sS -o "$RUNNER_TEMP/promotion-pr-response.json" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @"$RUNNER_TEMP/promotion-pr.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls")
          if [ "$status" = 201 ]; then
            url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_url"])' "$RUNNER_TEMP/promotion-pr-response.json")
            echo "Production promotion PR prepared: $url"
            echo "PR_URL=$url" >> "$GITHUB_ENV"
          else
            echo "::warning::PR creation returned HTTP $status. Release branch $branch was pushed; create its PR manually."
            echo "PR_URL=https://github.com/$GITHUB_REPOSITORY/compare/main...$branch" >> "$GITHUB_ENV"
          fi

      - name: Report release awaiting protected-branch merge
        env:
          PROMOTE_SHA: ${{ steps.pick.outputs.sha }}
          FROM_SHA: ${{ steps.pick.outputs.from }}
        run: |
          {
            echo '### Production promotion PR ready (not yet deployed)'
            echo
            echo "- Current production: $FROM_SHA"
            echo "- Staging release prepared: $PROMOTE_SHA"
            echo "- Pull request: $PR_URL"
            echo '- Merge the PR to update ArgoCD production image pins.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Ship just one approved frontend feature without inadvertently shipping every
  # other change on staging. This is deliberately NOT a copy of staging's
  # frontend image: staging may contain unapproved UI changes in the same image.
  # Instead we build from the deployed production frontend's source commit plus
  # an explicitly reviewed, branch-pinned subset of frontend file changes.
  selective-frontend:
    if: inputs.mode == 'frontend-only'
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production baseline and exact release file allowlist
        id: pick
        env:
          SELECTIVE_SOURCE: ${{ inputs.source_sha }}
          SELECTIVE_PATHS: ${{ inputs.approved_paths }}
          SELECTIVE_TEST: ${{ inputs.test_spec }}
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          python3 scripts/validate-selective-frontend.py \
            --source "$SELECTIVE_SOURCE" \
            --approved-paths "$SELECTIVE_PATHS" \
            --test-spec "$SELECTIVE_TEST"

      - name: Check out exactly the approved source, independent of staging
        run: git worktree add --detach release-src "${{ steps.pick.outputs.source_sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend from production plus the approved change
        run: |
          set -euo pipefail
          npm ci --prefix release-src/frontend
          npm --prefix release-src/frontend run build

      - name: Run the selected browser acceptance tests against this build
        env:
          SELECTIVE_TEST: ${{ inputs.test_spec }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm --prefix release-src/frontend run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/eesoc-selective-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ > /dev/null
          npx playwright test --config tests/e2e/selective-release.config.cjs "$SELECTIVE_TEST"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the owner for the registry
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build isolated frontend image (inherit production assets, never staging)
        uses: docker/build-push-action@v6
        with:
          context: ./release-src/frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/eesoc-frontend:${{ steps.pick.outputs.source_sha }}
          build-args: |
            VITE_API_BASE=/api
            PREVIOUS_FRONTEND_IMAGE=ghcr.io/${{ env.OWNER_LC }}/eesoc-frontend:${{ steps.pick.outputs.base_sha }}
          cache-from: type=gha,scope=selective-frontend
          cache-to: type=gha,mode=max,scope=selective-frontend

      - name: Install kustomize
        run: |
          curl -sfLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          rm kustomize.tar.gz

      - name: Publish a frontend-only production pin, refusing concurrent changes
        env:
          SELECTIVE_SOURCE: ${{ steps.pick.outputs.source_sha }}
          EXPECTED_FRONTEND: ${{ steps.pick.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          overlay=deploy/k8s/overlays/production/kustomization.yaml
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main

            # A second promote between the validation and this push must NOT
            # turn this into an unreviewed release against a different base.
            actual=$(python3 - <<'PY_CHECK'
          import yaml
          doc = yaml.safe_load(open('deploy/k8s/overlays/production/kustomization.yaml'))
          print(next(i['newTag'] for i in doc['images'] if i['name'] == 'ghcr.io/OWNER/eesoc-frontend'))
          PY_CHECK
            )
            if [ "$actual" != "$EXPECTED_FRONTEND" ]; then
              echo "::error::production frontend changed from $EXPECTED_FRONTEND to $actual; rebase and reapprove the release"
              exit 1
            fi

            cp "$overlay" /tmp/selective-production-before.yaml
            (cd deploy/k8s/overlays/production && \
              kustomize edit set image \
              "ghcr.io/OWNER/eesoc-frontend=ghcr.io/${OWNER_LC}/eesoc-frontend:${SELECTIVE_SOURCE}")

            # The pin may change *only* the frontend image, never any other
            # service. This deliberately leaves the production DB/API/Union/
            # WhatsApp versions unchanged and permits mixed production tags.
            python3 - <<'PY_COMPARE'
          import yaml
          old = yaml.safe_load(open('/tmp/selective-production-before.yaml'))
          new = yaml.safe_load(open('deploy/k8s/overlays/production/kustomization.yaml'))
          def pins(doc):
              return {i['name']: i for i in doc['images']}
          old_images, new_images = pins(old), pins(new)
          front = 'ghcr.io/OWNER/eesoc-frontend'
          if {k: v for k, v in old_images.items() if k != front} != {k: v for k, v in new_images.items() if k != front}:
              raise SystemExit('::error::non-frontend image pin unexpectedly changed')
          old['images'] = []
          new['images'] = []
          if old != new:
              raise SystemExit('::error::non-image production configuration unexpectedly changed')
          PY_COMPARE

            kustomize build deploy/k8s/overlays/production > /dev/null
            kustomize build deploy/k8s/overlays/staging > /dev/null
            git add "$overlay"
            git diff --cached --quiet && { echo '::error::no production change'; exit 1; }
            git diff --cached --name-only | grep -qx "$overlay"
            git commit -q -m "promote(frontend): $SELECTIVE_SOURCE only [skip ci]"
            if git push origin HEAD:main; then
              echo "Released ONLY the frontend image $SELECTIVE_SOURCE; all other production images unchanged"
              exit 0
            fi
            echo "main changed while pinning (attempt $attempt); retrying from its newest commit"
            sleep $((attempt * 3))
          done
          exit 1
