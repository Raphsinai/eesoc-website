# Manually stage one feature at a time by default, or stage all pending main
# changes in one explicit bulk release. Neither path modifies production.
name: stage EESoc features

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full (40-character) commit SHA to stage
        required: true
        type: string
      release_mode:
        description: Stage just the next feature or the entire pending main branch
        required: true
        default: next_feature
        type: choice
        options:
          - next_feature
          - all_pending

run-name: "Stage ${{ inputs.release_mode }} ${{ inputs.target_sha }}"

concurrency:
  group: eesoc-staging-feature
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      previous_sha: ${{ steps.target.outputs.previous_sha }}
    steps:
      - name: Repair persistent runner workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate selected staging target and release mode
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::Supply a full 40-character commit SHA'; exit 1; }
          git fetch -q origin main
          target=$(git rev-parse --verify "$REQUESTED_SHA^{commit}")
          git merge-base --is-ancestor "$target" origin/main || { echo '::error::Feature must be on main'; exit 1; }
          overlay=deploy/k8s/overlays/staging/kustomization.yaml
          pinned=$(grep -m1 'newTag:' "$overlay" | awk '{print $2}')
          git merge-base --is-ancestor "$pinned" "$target" || { echo '::error::Cannot roll staging back with a feature release'; exit 1; }
          next=$(git rev-list --reverse --first-parent "$pinned"..origin/main -- . \
            ':(exclude).github/workflows' \
            ':(exclude)docs' \
            ':(exclude)deploy/README.md' \
            ':(exclude)deploy/homelab/README.md' \
            ':(exclude)deploy/k8s/overlays/staging/kustomization.yaml' | head -n1)
          if [ "$RELEASE_MODE" = all_pending ]; then
            latest=$(git rev-parse origin/main)
            if [ "$target" != "$latest" ]; then
              echo "::error::Bulk staging requires the exact current main HEAD ($latest)"
              exit 1
            fi
            echo "Bulk staging authorised: from $pinned to $target"
          elif [ "$RELEASE_MODE" = next_feature ]; then
            if [ -z "$next" ] || [ "$target" != "$next" ]; then
              echo "::error::Next stageable feature is ${next:-none}, not $target"
              exit 1
            fi
          else
            echo "::error::Unrecognised release mode"
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$pinned" >> "$GITHUB_OUTPUT"
          echo "Verified staging target: $(git show -s --format='%h %s' "$target")"

  tests:
    needs: validate
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    steps:
      - name: Repair persistent runner workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused feature and migration regression tests
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/api/requirements-dev.txt
          suites=(tests/permissions tests/zero-downtime/test_check_migrations.py)
          [ ! -d tests/product-sales ] || suites+=(tests/product-sales)
          python3 -m pytest "${suites[@]}" -q

  images:
    needs: [validate, tests]
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, context: backend/api }
          - { name: database, context: backend/database }
          - { name: union, context: backend/union }
          - { name: frontend, context: frontend }
          - { name: garage-init, context: deploy/garage-init }
          - { name: whatsapp, context: backend/whatsapp }
    permissions:
      contents: read
      packages: write
    steps:
      - name: Repair persistent runner workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalise the registry owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      - name: Build exactly the selected commit, not latest main
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/eesoc-${{ matrix.name }}:${{ needs.validate.outputs.sha }}
          build-args: |
            VITE_API_BASE=/api
            PREVIOUS_FRONTEND_IMAGE=ghcr.io/${{ env.OWNER_LC }}/eesoc-frontend:${{ needs.validate.outputs.previous_sha }}
          cache-from: type=gha,scope=feature-${{ matrix.name }}
          cache-to: type=gha,scope=feature-${{ matrix.name }},mode=max

  pin-staging:
    needs: [validate, tests, images]
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Repair persistent runner workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          rm kustomize.tar.gz
      - name: Commit selected release SHA to staging (never production)
        env:
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          owner_lc=${OWNER,,}
          overlay=deploy/k8s/overlays/staging
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            pinned=$(grep -m1 'newTag:' "$overlay/kustomization.yaml" | awk '{print $2}')
            [ "$pinned" != "$TARGET_SHA" ] || { echo 'Already staged'; exit 0; }
            next=$(git rev-list --reverse --first-parent "$pinned"..origin/main -- . \
              ':(exclude).github/workflows' \
              ':(exclude)docs' \
              ':(exclude)deploy/README.md' \
              ':(exclude)deploy/homelab/README.md' \
              ':(exclude)deploy/k8s/overlays/staging/kustomization.yaml' | head -n1)
            if [ "$RELEASE_MODE" = all_pending ]; then
              git merge-base --is-ancestor "$pinned" "$TARGET_SHA" || { echo '::error::Staging is no longer an ancestor of target'; exit 1; }
              latest=$(git rev-parse origin/main)
              [ "$latest" = "$TARGET_SHA" ] || { echo "::error::main moved while building ($latest); rerun against latest main"; exit 1; }
            elif [ "$RELEASE_MODE" = next_feature ]; then
              [ "$next" = "$TARGET_SHA" ] || { echo "::error::Staging advanced; next feature is $next"; exit 1; }
            else
              echo '::error::Invalid staging release mode'; exit 1
            fi
            (
              cd "$overlay"
              for service in api database union frontend garage-init whatsapp; do
                kustomize edit set image \
                  "ghcr.io/OWNER/eesoc-${service}=ghcr.io/${owner_lc}/eesoc-${service}:${TARGET_SHA}"
              done
            )
            kustomize build "$overlay" > /dev/null
            git add "$overlay/kustomization.yaml"
            git commit -q -m "staging: $TARGET_SHA ($RELEASE_MODE) [skip ci]"
            if git push -q origin HEAD:main; then
              echo "Staging pin committed for $TARGET_SHA; ArgoCD will reconcile"
              exit 0
            fi
            echo "Push raced with main; retrying (${attempt}/3)"
          done
          echo '::error::Unable to publish the staging pin after 3 tries'
          exit 1
