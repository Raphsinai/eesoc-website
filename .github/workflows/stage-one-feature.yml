# Manually stage one feature at a time by default, or stage all pending main
# changes in one explicit bulk release. Neither path modifies production.
name: stage EESoc features

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full (40-character) commit SHA to stage
        required: true
        type: string
      release_mode:
        description: Stage just the next feature or the entire pending main branch
        required: true
        default: next_feature
        type: choice
        options:
          - next_feature
          - all_pending

run-name: "Stage ${{ inputs.release_mode }} ${{ inputs.target_sha }}"

concurrency:
  group: eesoc-staging-feature
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      previous_sha: ${{ steps.target.outputs.previous_sha }}
    steps:
      - name: Repair persistent runner workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate selected staging target and release mode
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::Supply a full 40-character commit SHA'; exit 1; }
          git fetch -q origin main
          target=$(git rev-parse --verify "$REQUESTED_SHA^{commit}")
          git merge-base --is-ancestor "$target" origin/main || { echo '::error::Feature must be on main'; exit 1; }
          overlay=deploy/k8s/overlays/staging/kustomization.yaml
          pinned=$(grep -m1 'newTag:' "$overlay" | awk '{print $2}')
          git merge-base --is-ancestor "$pinned" "$target" || { echo '::error::Cannot roll staging back with a feature release'; exit 1; }
          next=$(git rev-list --reverse --first-parent "$pinned"..origin/main -- . \
            ':(exclude).github/workflows' \
            ':(exclude)docs' \
            ':(exclude)deploy/README.md' \
            ':(exclude)deploy/homelab/README.md' \
            ':(exclude)deploy/k8s/overlays/staging/kustomization.yaml' | head -n1)
          if [ "$RELEASE_MODE" = all_pending ]; then
            latest=$(git rev-parse origin/main)
            if [ "$target" != "$latest" ]; then
              echo "::error::Bulk staging requires the exact current main HEAD ($latest)"
              exit 1
            fi
            echo "Bulk staging authorised: from $pinned to $target"
          elif [ "$RELEASE_MODE" = next_feature ]; then
            if [ -z "$next" ] || [ "$target" != "$next" ]; then
              echo "::error::Next stageable feature is ${next:-none}, not $target"
              exit 1
            fi
          else
            echo "::error::Unrecognised release mode"
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$pinned" >> "$GITHUB_OUTPUT"
          echo "Verified staging target: $(git show -s --format='%h %s' "$target")"

  publish-staging-pr:
    needs: validate
    runs-on: [self-hosted, Linux, X64, eesoc-ci]
    environment: staging
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Reclaim checkout
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm all required CI jobs passed for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          # Builds from a failed or merely queued CI run must never deploy.
          python3 scripts/check-ci-release.py "$RELEASE_SHA"
      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/kustomize.tar.gz" 'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz'
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
      - name: Open protected staging pin pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="release/staging-${RELEASE_SHA}"
          owner_lc=${OWNER,,}
          git fetch -q origin main
          git reset -q --hard origin/main
          overlay=deploy/k8s/overlays/staging
          pinned=$(awk '/newTag:/ {print $2; exit}' "$overlay/kustomization.yaml")
          [ "$pinned" != "$RELEASE_SHA" ] || { echo 'Already staged'; exit 0; }
          git merge-base --is-ancestor "$pinned" "$RELEASE_SHA" || { echo '::error::Staging is ahead of target'; exit 1; }
          next=$(git rev-list --reverse --first-parent "$pinned"..origin/main -- . \
            ':(exclude).github/workflows' ':(exclude)docs' \
            ':(exclude)deploy/README.md' ':(exclude)deploy/homelab/README.md' \
            ':(exclude)deploy/k8s/overlays/staging/kustomization.yaml' | head -n1)
          if [ "$RELEASE_MODE" = next_feature ]; then
            [ "$next" = "$RELEASE_SHA" ] || { echo "::error::Next release has changed: $next"; exit 1; }
          else
            [ "$(git rev-parse origin/main)" = "$RELEASE_SHA" ] || { echo '::error::Bulk release must be current main'; exit 1; }
          fi
          git switch -c "$branch"
          for service in api database union frontend garage-init whatsapp; do
            (cd "$overlay" && "$RUNNER_TEMP/kustomize" edit set image "ghcr.io/OWNER/eesoc-${service}=ghcr.io/${owner_lc}/eesoc-${service}:${RELEASE_SHA}")
          done
          "$RUNNER_TEMP/kustomize" build "$overlay" > /dev/null
          git add "$overlay/kustomization.yaml"
          git commit -m "staging: deploy checked $RELEASE_SHA [skip ci]"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Stage EESoc $RELEASE_SHA" --body "Promotes the exact commit whose CI checks and six image builds completed successfully. Release mode: $RELEASE_MODE. Only staging image pins change. Merge this PR after GitHub's required checks pass."
