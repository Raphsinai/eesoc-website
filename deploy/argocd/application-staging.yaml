# ArgoCD watches the staging overlay — eesoc.raphsinai.dev, namespace
# eesoc-staging.
#
# Applied in the ArgoCD that runs INSIDE the staging VM on the homelab
# (deploy/homelab), not production's: since 2026-10-19 the two environments
# are separate clusters. It is that cluster's only Application.
#
# TEMPORARY: staging follows the staging-deploy GitOps branch while CI is
# being repaired. This branch is rebuilt from main by the manual staging
# workflow, after its images have successfully published. Production still
# follows its separate overlay on main; promotion must use tested image SHAs,
# never merge staging-deploy into main. The deploy key is read-only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eesoc-website-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # SSH, matching the read-only deploy key registered in argocd as the
    # `eesoc-website-repo` secret. HTTPS would need a token with repo scope;
    # a deploy key is scoped to this one repository and cannot write.
    repoURL: git@github.com:Raphsinai/eesoc-website.git
    targetRevision: staging-deploy
    path: deploy/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: eesoc-staging
  syncPolicy:
    automated:
      prune: true # a resource deleted from git is deleted from the cluster
      selfHeal: true # manual kubectl edits get reverted
    syncOptions:
      - CreateNamespace=true
      # PVCs are pruned last, so a manifest change cannot delete the media
      # volume before its replacement exists.
      - PruneLast=true
      # Honour the ignoreDifferences below during sync, not just in the diff
      # view — otherwise selfHeal reverts the operator's own writes to the
      # Cluster resource.
      - RespectIgnoreDifferences=true
      # Ordering comes from argocd.argoproj.io/sync-wave annotations on the
      # resources themselves: CNPG Cluster (-1), adapter migrations (1), api (2).
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # CloudNativePG writes extensively to its own Cluster resource — status,
    # instance names, the current primary. All of it would read as permanent
    # drift and, with selfHeal on, Argo would fight the operator over it.
    - group: postgresql.cnpg.io
      kind: Cluster
      name: eesoc-db
      jsonPointers:
        - /status
        - /spec/instances # the operator adjusts this during failover
