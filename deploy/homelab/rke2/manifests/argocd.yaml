# ArgoCD — the version production runs (v3.4.6). It watches exactly one
# Application, deploy/argocd/application-staging.yaml, applied by hand after
# the repo credential (README.md, "Rebuilding").
#
# Trimmed to what one Application needs: no Dex (nobody signs in to it; use
# `kubectl port-forward` and the admin secret), no notifications, no
# ApplicationSets.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.2.2
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    dex:
      enabled: false
    notifications:
      enabled: false
    applicationSet:
      replicas: 0
    configs:
      params:
        server.insecure: true
    controller:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { memory: 768Mi }
    repoServer:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { memory: 512Mi }
    server:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits:   { memory: 256Mi }
    redis:
      resources:
        requests: { cpu: 25m, memory: 32Mi }
        limits:   { memory: 128Mi }
