# CloudNativePG operator — the version production runs (1.30.1).
# base/networkpolicy.yaml admits it from the cnpg-system namespace.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cnpg
  namespace: kube-system
spec:
  repo: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  version: 0.29.1
  targetNamespace: cnpg-system
  createNamespace: true
  valuesContent: |-
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits:   { memory: 384Mi }
