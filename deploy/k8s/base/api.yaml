apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: eesoc
  annotations:
    # After the adapter has migrated the schema (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: eesoc
  annotations:
    # After the adapter has migrated the schema (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Uploads no longer pin this to a node — they go to object storage — but the
  # daily ICU sync still runs inside the process and its lock does not span pods.
  # Move the sync to a CronJob calling POST /admin/sync before scaling up.
  replicas: 1
  # maxSurge 0: the node has no spare pod slot, and the default rolling update
  # wants to start the new pod before stopping the old one — which would wait
  # forever for capacity that cannot appear. Old pod goes first instead, so an
  # update is a brief restart rather than a deadlock.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      # The repository is private, so its GHCR images are too. `ghcr-pull` is a
      # docker-registry secret in this namespace and is NOT in git.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/OWNER/eesoc-api
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: eesoc-config }
            # S3 credentials live alongside the other secrets.
            - secretRef:    { name: eesoc-secrets }
          livenessProbe:
            # /health does not touch the database on purpose — see api/main.py.
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            # /ready does check dependencies, so a pod that cannot reach the
            # adapter leaves the load balancer instead of serving errors.
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { memory: 512Mi }

        # The SPA, served from this pod rather than its own.
        #
        # A container costs nothing against the kubelet's pod limit, and the
        # node is at it — this is the difference between the site fitting and
        # not. Nothing is given up: the api is already pinned to one replica by
        # its in-process sync lock, so the two could never scale apart anyway.
        #
        # nginx still proxies /api through the `api` Service rather than
        # localhost, so the identical config works under docker compose, where
        # these genuinely are separate containers.
        - name: web
          image: ghcr.io/OWNER/eesoc-frontend
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { memory: 192Mi }
