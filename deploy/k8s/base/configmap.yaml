# Non-secret configuration. Secrets (ICU_API_KEY, SMTP_USER, SMTP_PASS) come from
# a Secret named `eesoc-secrets`, which is NOT in git. Database credentials are
# not here at all — CloudNativePG owns those — create it with sealed-secrets,
# External Secrets or `kubectl create secret`. See deploy/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eesoc-config
data:
  ENVIRONMENT: "production"
  # Hard off in production. The api refuses to start if this is true here.
  DEV_LOGIN_ENABLED: "false"

  # Every member is at Imperial, so the servers keep London time. The code
  # converts to London explicitly wherever a time is shown; this is the
  # backstop for anything that reads the local clock (CURRENT_DATE, the email
  # Date header, a log line) so it never comes out an hour off in BST.
  TZ: "Europe/London"

  DATABASE_ADAPTER_URL: "http://database:8080"
  UNION_API_URL: "http://union:8080"
  # Uploads go to object storage rather than a ReadWriteMany volume: RWX is not
  # available on every cluster, and serving from a bucket or CDN means an image
  # request never reaches a pod. Credentials are in eesoc-secrets.
  MEDIA_BACKEND: "s3"
  S3_BUCKET: "eesoc-media"
  S3_REGION: "garage" # must match s3_region in garage.toml
  # Where we WRITE: the in-cluster Garage S3 API.
  S3_ENDPOINT_URL: "http://garage:3900"
  # Where browsers READ. Served through our own domain by the Ingress, so there
  # is no second hostname and no second certificate. The /media path is rewritten
  # to the bucket, which is why the prefix below is empty — otherwise keys would
  # come out as /media/media/...
  S3_PREFIX: ""
  # Deliberately relative, not "https://eesoc.com/media".
  #
  # The URL this produces is stored in the database on upload — on
  # committee_profiles.photo_url and events.image_url — so an absolute one
  # bakes today's hostname into every row and the cutover from the test domain
  # left them all pointing at it. Relative follows whatever host serves the
  # page, and the Ingress answers /media on all of them. Nothing needs it
  # absolute: og:image is a static asset with its own hardcoded URL.
  S3_PUBLIC_BASE_URL: "/media"

  # This one must stay absolute — it goes into sign-in links in email, where
  # there is no page to be relative to.
  #
  # Changing it needs `kubectl -n eesoc rollout restart deploy/api`: the pod
  # reads its environment once at startup and nothing here triggers a new one,
  # so ArgoCD will report Synced while the old value is still live.
  SITE_ORIGIN: "https://eesoc.com"

  # PG_* are deliberately absent: CloudNativePG generates the credentials and
  # the database service reads them from the `eesoc-db-app` secret it creates.

  ICU_CENTRE_CODE: "603"
  ICU_CACHE_TTL: "3600"
  ICU_MIN_INTERVAL: "2"

  # The Union's sales feed refreshes overnight; pull it first thing.
  SYNC_HOUR: "6"
  SYNC_MINUTE: "5"

  # Served over HTTPS in the cluster, so Secure cookies are required.
  COOKIE_SECURE: "true"
  # Imperial's shared webmaster mailbox. SMTP_PASS is in eesoc-secrets and must
  # be updated when the account's password is reset — which Imperial forces
  # yearly, and which silently breaks all outbound email if missed.
  SMTP_HOST: "smtp.office365.com"
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
  SMTP_USER: "eesocweb@ic.ac.uk"
  SMTP_FROM: "EESoc Webmaster <eesocweb@ic.ac.uk>"
  SMTP_REPLY_TO: "eesoc@imperial.ac.uk"
  # Codes must never be written to logs in production.
  LOG_CODES_WHEN_UNCONFIGURED: "false"

  # Features to force under maintenance, comma separated. Anything whose
  # dependencies are missing is detected automatically — with no SMTP_PASS, for
  # instance, sign-in and event booking take themselves offline and say so,
  # rather than accepting bookings that can never be confirmed. This is only for
  # breakage the process cannot detect itself.
  # Keys: login, bookings, lockers, sponsor_portal, admin
  #
  # Lockers: paused until a Union product is linked to them. Without a link
  # the site cannot tell who has paid, so every booking would be taken on
  # trust and reconciled by hand. Empty this to turn booking back on.
  MAINTENANCE_FEATURES: "lockers"
  MAINTENANCE_MESSAGE: "Locker booking is paused while we finish setting up payment through the Union shop. It will be back shortly."
