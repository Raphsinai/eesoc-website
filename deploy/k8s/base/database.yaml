# SQL adapter. Runs the migrations on startup, guarded by an advisory lock so
# multiple replicas queue rather than race.
apiVersion: v1
kind: Service
metadata: { name: database, namespace: eesoc }
spec:
  selector: { app: database }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: eesoc
  annotations:
    # After the CNPG cluster (wave -1): this pod runs the migrations on startup.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector: { matchLabels: { app: database } }
  template:
    metadata: { labels: { app: database } }
    spec:
      # The repository is private, so its GHCR images are too. `ghcr-pull` is a
      # docker-registry secret in this namespace and is NOT in git.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: database
          image: ghcr.io/OWNER/eesoc-database
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: eesoc-config }
          # Credentials come from the secret CloudNativePG generates for the
          # cluster's app user — `eesoc-db-app`. Nothing about the database is in
          # our own ConfigMap or Secret, so there is no password to rotate by hand
          # and no chance of the two drifting apart.
          env:
            - name: PG_HOST
              valueFrom: { secretKeyRef: { name: eesoc-db-app, key: host } }
            - name: PG_PORT
              valueFrom: { secretKeyRef: { name: eesoc-db-app, key: port } }
            - name: PG_DB
              valueFrom: { secretKeyRef: { name: eesoc-db-app, key: dbname } }
            - name: PG_USER
              valueFrom: { secretKeyRef: { name: eesoc-db-app, key: username } }
            - name: PG_PASS
              valueFrom: { secretKeyRef: { name: eesoc-db-app, key: password } }
          # No liveness probe on the database check: a transient Postgres blip
          # would restart every replica at once, turning a hiccup into an outage.
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
