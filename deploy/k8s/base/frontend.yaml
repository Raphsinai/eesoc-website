# The SPA has no Deployment of its own: its nginx runs as the `web` container
# in the api pod. See api.yaml for why.
#
# The Service stays, so the Ingress and anything else still address "frontend"
# without caring where it runs.
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 80 }]
