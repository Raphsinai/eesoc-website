# Object storage for uploads: event posters, committee photos, sponsor logos.
#
# Garage rather than MinIO. MinIO's community images are no longer publicly
# pullable — Docker Hub reports the `minio/minio` repository itself as "object
# not found", and quay.io answers 401 on an anonymous pull. Anything still
# running MinIO is doing so on a cached layer and will not survive a
# reschedule. Garage is S3-compatible, actively published, and small.
#
# Nothing in the application changed: services/storage.py already speaks S3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: eesoc
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir     = "/var/lib/garage/data"
    db_engine    = "sqlite"

    # One node, so one copy. Garage refuses to start if this exceeds the number
    # of nodes it can actually place replicas on.
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    # Must be an address the node can reach itself on. Within the pod that is
    # loopback, and the init sidecar shares the network namespace.
    rpc_public_addr = "127.0.0.1:3901"
    # rpc_secret is NOT here — it comes from GARAGE_RPC_SECRET in eesoc-secrets,
    # so this ConfigMap stays safe to keep in git.

    [s3_api]
    s3_region     = "garage"
    api_bind_addr = "[::]:3900"
    root_domain   = ".s3.garage"

    # The anonymous read endpoint. Garage has no public-read ACL on the S3 API
    # the way MinIO did, so unauthenticated GETs are served here instead and the
    # bucket is chosen from the Host header against root_domain. The S3 API
    # stays private, which is what keeps uploads from being writable by anyone.
    [s3_web]
    bind_addr   = "[::]:3902"
    root_domain = ".web.garage"
    index       = "index.html"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: eesoc
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: eesoc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  # Two pods cannot hold the same ReadWriteOnce volume, and a rolling update
  # would deadlock waiting for one that can never attach.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: garage }
  template:
    metadata:
      labels: { app: garage }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: garage
          image: dxflrs/garage:v1.1.0
          args: ["server"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: { name: eesoc-secrets, key: GARAGE_RPC_SECRET }
          ports:
            - { name: s3,  containerPort: 3900 }
            - { name: web, containerPort: 3902 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: data,   mountPath: /var/lib/garage }
          readinessProbe:
            tcpSocket: { port: 3900 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits:   { memory: 1Gi }

        # Creates the layout, bucket and access key, then idles. A sidecar
        # rather than a Job: the CLI authenticates with a node key held in the
        # metadata directory, so it has to share this pod's volume — and the
        # node has no spare pod slots for a Job anyway.
        - name: init
          image: ghcr.io/OWNER/eesoc-garage-init
          command: ["/bin/sh", "-c"]
          args:
            - garage-init && echo "init complete, idling" && sleep infinity
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: { name: eesoc-secrets, key: GARAGE_RPC_SECRET }
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: eesoc-secrets, key: S3_ACCESS_KEY_ID }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: eesoc-secrets, key: S3_SECRET_ACCESS_KEY }
            - name: GARAGE_BUCKET
              valueFrom:
                configMapKeyRef: { name: eesoc-config, key: S3_BUCKET }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: data,   mountPath: /var/lib/garage }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: garage-config }
        - name: data
          persistentVolumeClaim: { claimName: garage-data }
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: eesoc
spec:
  selector: { app: garage }
  ports:
    - { name: s3,  port: 3900, targetPort: 3900 }
    - { name: web, port: 3902, targetPort: 3902 }
