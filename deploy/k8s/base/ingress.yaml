# Single entry point, plain HTTP.
#
# TLS is terminated by an nginx reverse proxy on a separate VM (see
# deploy/nginx/eesoc.conf), so there is nothing to certificate here and no
# cert-manager involvement. The hop from that VM into the cluster is HTTP.
#
# Everything goes to the frontend, which proxies /api internally — the browser
# only ever sees one origin, so session cookies work without SameSite=None.
#
# NOTE: this listens on plain HTTP for any host that resolves to the ingress.
# The cluster must therefore only be reachable from the proxy VM — enforce that
# at the firewall or with a LoadBalancer source range. An HTTP ingress exposed
# to the internet would serve the site unencrypted and strip the protection the
# Secure cookie flag assumes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eesoc
  namespace: eesoc
  annotations:
    # Uploads are capped at 10 MB in the application; leave headroom for
    # multipart overhead.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    # The edge proxy already redirects http -> https. Doing it again here would
    # send the browser to https://<internal-host> and break the request.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # Host-based so the proxy can pass `Host: eesoc.com` straight through, which
    # keeps redirects and canonical URLs correct.
    - host: eesoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.eesoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# /media/<key> has to reach MinIO as /<bucket>/<key>, so the bucket name is added
# on the way through. A separate Ingress because the rewrite annotation applies
# to every path in an Ingress object, and rewriting "/" would break the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eesoc-media
  namespace: eesoc
  annotations:
    # Garage serves anonymous reads from its web endpoint, choosing the
    # bucket from the Host header against root_domain (.web.garage). So the
    # path loses the /media prefix and the bucket arrives as the vhost.
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/upstream-vhost: eesoc-media.web.garage
    # No configuration-snippet here: this cluster's ingress controller has
    # snippet directives disabled by the administrator, and the admission
    # webhook rejects the whole Ingress — which aborts the ArgoCD sync before
    # it reaches the later waves, so nothing else deploys either.
    #
    # Nothing is lost. The immutable cache header is stored on the object at
    # upload time (see services/storage.py) and Garage returns it verbatim;
    # verified on an anonymous read. nosniff is set by the edge nginx instead,
    # which already terminates TLS in front of this.
spec:
  ingressClassName: nginx
  rules:
    - host: eesoc.com
      http:
        paths:
          - path: /media/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: garage
                port:
                  number: 3902
    - host: www.eesoc.com
      http:
        paths:
          - path: /media/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: garage
                port:
                  number: 3902
