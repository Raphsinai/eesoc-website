# Base manifests. Environment-specific values live in the overlays; ArgoCD
# points at an overlay, never at this directory directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- configmap.yaml
- postgres.yaml
- garage.yaml
- database.yaml
- union.yaml
- api.yaml
- frontend.yaml
- ingress.yaml
- networkpolicy.yaml

commonLabels:
  app.kubernetes.io/part-of: eesoc-website

# Image tags are patched by CI (kustomize edit set image), which is what makes
# the GitOps loop work: the workflow commits a new tag and ArgoCD syncs it.
images:
- name: ghcr.io/OWNER/eesoc-api
  newName: ghcr.io/raphsinai/eesoc-api
  newTag: b8d8bc3adaee1dd3b73d30917887c0d16c8a5e90
- name: ghcr.io/OWNER/eesoc-database
  newName: ghcr.io/raphsinai/eesoc-database
  newTag: b8d8bc3adaee1dd3b73d30917887c0d16c8a5e90
- name: ghcr.io/OWNER/eesoc-frontend
  newName: ghcr.io/raphsinai/eesoc-frontend
  newTag: b8d8bc3adaee1dd3b73d30917887c0d16c8a5e90
- name: ghcr.io/OWNER/eesoc-garage-init
  newName: ghcr.io/raphsinai/eesoc-garage-init
  newTag: b8d8bc3adaee1dd3b73d30917887c0d16c8a5e90
- name: ghcr.io/OWNER/eesoc-union
  newName: ghcr.io/raphsinai/eesoc-union
  newTag: b8d8bc3adaee1dd3b73d30917887c0d16c8a5e90
