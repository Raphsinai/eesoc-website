# Base manifests. Environment-specific values live in the overlays; ArgoCD
# points at an overlay, never at this directory directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- configmap.yaml
- postgres.yaml
- garage.yaml
- database.yaml
- union.yaml
- api.yaml
- frontend.yaml
- ingress.yaml
- networkpolicy.yaml

commonLabels:
  app.kubernetes.io/part-of: eesoc-website

# No `images:` block here, deliberately.
#
# Image tags are pinned per overlay, because that is the whole of the promotion
# model: CI pins a new SHA in overlays/staging on every push to main, and the
# promote workflow copies whatever SHA staging is running into
# overlays/production. A tag here would be shared by both environments and
# there would be nothing left to promote — every push would go straight to
# eesoc.com.
