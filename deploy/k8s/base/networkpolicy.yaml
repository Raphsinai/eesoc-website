# Only the api may reach the adapter and the bridge, and only the adapter may
# reach Postgres. Without this, any compromised pod in the namespace could talk
# straight to the unauthenticated SQL adapter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: database-ingress, namespace: eesoc }
spec:
  podSelector: { matchLabels: { app: database } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api } } }]
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: union-ingress, namespace: eesoc }
spec:
  podSelector: { matchLabels: { app: union } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: api } } }]
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-ingress, namespace: eesoc }
spec:
  # CNPG labels its pods with the cluster name, not `app: postgres`.
  podSelector:
    matchLabels:
      cnpg.io/cluster: eesoc-db
  policyTypes: [Ingress]
  ingress:
    # The adapter is the only client...
    - from: [{ podSelector: { matchLabels: { app: database } } }]
      ports: [{ port: 5432 }]
    # ...plus the operator and the instances themselves, for replication and
    # failover. Omitting this breaks streaming replication.
    - from:
        - podSelector: { matchLabels: { cnpg.io/cluster: eesoc-db } }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports: [{ port: 5432 }, { port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: garage-ingress, namespace: eesoc }
spec:
  podSelector: { matchLabels: { app: garage } }
  policyTypes: [Ingress]
  ingress:
    # Two ports with genuinely different audiences, so they get separate rules
    # rather than one that allows both sources to both.
    #
    # 3900 is the S3 API: it takes credentials and can write. Only the api
    # needs it, and nothing else in the cluster should be able to reach it.
    - from:
        - podSelector: { matchLabels: { app: api } }
      ports: [{ port: 3900 }]
    # 3902 is the anonymous read endpoint the ingress controller serves to
    # browsers. It cannot write, so letting the controller reach it costs
    # nothing.
    #
    # The controller is RKE2's bundled one and lives in kube-system, NOT in a
    # namespace called ingress-nginx — that guess silently blackholed every
    # /media request into a 504, since a NetworkPolicy drops rather than
    # rejects. The namespace and pod selectors are in one `from` entry so they
    # AND together: kube-system holds plenty that has no business here.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: rke2-ingress-nginx }
      ports: [{ port: 3902 }]
