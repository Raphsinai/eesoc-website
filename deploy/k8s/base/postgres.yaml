# Postgres, managed by CloudNativePG.
#
# Replaces a hand-rolled StatefulSet, which gave us one pod, no failover, no
# backups and a manual upgrade path — the one component whose loss is
# unrecoverable. CNPG handles replication, failover, PITR and minor-version
# upgrades, and it is already running on this cluster.
#
# CNPG creates for us:
#   * `eesoc-db-rw`  — service pointing at the current primary
#   * `eesoc-db-ro`  — read-only replicas
#   * `eesoc-db-app` — secret with username / password / dbname / host / uri
#
# Nothing here holds a credential: the app secret is generated by the operator,
# and the database service reads it by key.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: eesoc-db
  annotations:
    # Created before the workloads that depend on it. Without this the adapter
    # crash-loops on its first sync while the cluster is still bootstrapping —
    # harmless, but it makes a first deploy look broken.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 2 # one primary, one replica: survives a node going away
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  bootstrap:
    initdb:
      database: eesoc
      owner: eesoc
      # Secret is generated by the operator if absent, so no password is ever in
      # git. Migrations are applied by the database service on startup.
      encoding: UTF8

  storage:
    size: 10Gi
    # storageClass: intentionally unset — inherits the cluster default. Pin it in
    # the overlay if this needs specific storage.

  # Room to fail over without the primary being evicted for resource pressure.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  postgresql:
    parameters:
      # Modest defaults; this is a society site, not a warehouse.
      max_connections: "100"
      shared_buffers: 128MB
      # London, matching TZ in the ConfigMap: CURRENT_DATE and any
      # timestamptz printed by psql read as a person in London expects.
      # Stored values are unaffected — timestamptz is an instant either way.
      timezone: Europe/London
      log_timezone: Europe/London

  # Keep a replica on a different node where the cluster allows it.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  monitoring:
    enablePodMonitor: false # set true if Prometheus Operator is installed
---
# Nightly backup.
#
# Commented out because it needs a destination and credentials that are specific
# to this cluster's object storage. WITHOUT THIS THERE ARE NO BACKUPS — the
# replica protects against a node failure, not against a bad migration or a
# DELETE without a WHERE clause. Fill in the bucket and uncomment.
#
# apiVersion: postgresql.cnpg.io/v1
# kind: ScheduledBackup
# metadata:
#   name: eesoc-db-nightly
#   namespace: eesoc
# spec:
#   schedule: "0 30 2 * * *"      # 02:30 daily (CNPG uses 6-field cron)
#   backupOwnerReference: self
#   cluster:
#     name: eesoc-db
#
# ...and add to the Cluster spec above:
#
# spec:
#   backup:
#     barmanObjectStore:
#       destinationPath: s3://BUCKET/eesoc-db
#       s3Credentials:
#         accessKeyId:     { name: eesoc-db-backup, key: ACCESS_KEY_ID }
#         secretAccessKey: { name: eesoc-db-backup, key: SECRET_ACCESS_KEY }
#     retentionPolicy: "30d"
