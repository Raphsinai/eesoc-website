# ICU bridge.
#
# Deliberately ONE replica. The upstream rate limit is per source IP and bans
# the whole society on breach; the in-process cache and minimum-interval
# throttle only bound request rate if there is a single instance holding them.
apiVersion: v1
kind: Service
metadata: { name: union }
spec:
  selector: { app: union }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: union }
spec:
  replicas: 1
  # Recreate, not a surge-free RollingUpdate: two union pods must never exist
  # at once, even briefly, because eActivities rate-limits per source IP and
  # bans the society on breach. It also never needs a spare pod slot, which
  # suits a node at its limit.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: union } }
  template:
    metadata: { labels: { app: union } }
    spec:
      # The repository is private, so its GHCR images are too. `ghcr-pull` is a
      # docker-registry secret in this namespace and is NOT in git.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: union
          image: ghcr.io/OWNER/eesoc-union
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: eesoc-config }
            - secretRef:    { name: eesoc-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits:   { memory: 256Mi }
