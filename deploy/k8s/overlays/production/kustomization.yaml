# Production — eesoc.com. Namespace `eesoc`.
#
# Nothing commits to this overlay on a push. Image tags arrive here only via
# .github/workflows/promote.yml, which copies the SHA staging is already
# running. A rollback is `git revert` of that commit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eesoc
resources:
  - ../../base
  - snapshot-cronjob.yaml
  # The scrub/restore scripts, shared with the other environment.
  - ../../../snapshot

# The scrub, its verification, and the two scripts that drive them. A generator
# rather than a checked-in ConfigMap so the content is versioned with the
# files: kustomize appends a hash to the name, so editing scrub.sql changes the
# ConfigMap name, which changes the pod template, which is what makes the next
# run actually pick the change up.

# Pinned by the promote workflow (`kustomize edit set image`). The
# ghcr.io/OWNER/... left-hand side is a match key against the base manifests,
# not a real image name — CI rewrites newName/newTag and never touches it.
images:
- name: ghcr.io/OWNER/eesoc-api
  newName: ghcr.io/raphsinai/eesoc-api
  newTag: 8efca7df15b2a7a60442ea07d85bc95d9fbe1a10
- name: ghcr.io/OWNER/eesoc-database
  newName: ghcr.io/raphsinai/eesoc-database
  newTag: 8efca7df15b2a7a60442ea07d85bc95d9fbe1a10
- name: ghcr.io/OWNER/eesoc-frontend
  newName: ghcr.io/raphsinai/eesoc-frontend
  newTag: 8efca7df15b2a7a60442ea07d85bc95d9fbe1a10
- name: ghcr.io/OWNER/eesoc-garage-init
  newName: ghcr.io/raphsinai/eesoc-garage-init
  newTag: 8efca7df15b2a7a60442ea07d85bc95d9fbe1a10
- name: ghcr.io/OWNER/eesoc-union
  newName: ghcr.io/raphsinai/eesoc-union
  newTag: 8efca7df15b2a7a60442ea07d85bc95d9fbe1a10

# Single-node cluster. A second replica of anything lands on the same node as
# the first, so it buys no availability — it only consumes one of the kubelet's
# 110 pod slots, which is the binding constraint here, not CPU or memory.
#
# The base keeps the multi-replica defaults: on a cluster with more than one
# node they are correct, and this overlay is the right place to say "not here".
replicas:
  - name: database
    count: 1

patches:
  - path: ingress-hosts.yaml
  - path: snapshot-access.yaml
  # Same reasoning for Postgres: two CNPG instances on one node protect against
  # a pod failure but not a node failure, which is the one that actually ends
  # the site. Restore this to 2 the moment there is a second node — it is what
  # makes failover real.
  - target: { group: postgresql.cnpg.io, kind: Cluster, name: eesoc-db }
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
