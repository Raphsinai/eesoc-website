# Let the ingress controller reach production's S3 API for snapshot.eesoc.com,
# and give Garage the names it needs to create the snapshot bucket and the
# read-only key.
#
# Production only. Staging has no equivalent — nothing in production ever
# connects to staging, which is what makes the refresh one-way.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: garage-ingress }
spec:
  podSelector: { matchLabels: { app: garage } }
  policyTypes: [Ingress]
  # A strategic merge patch replaces this list rather than appending, so the
  # two base rules are restated here. Splitting them across files would mean
  # reading three files to answer "who can reach Garage".
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api } }
      ports: [{ port: 3900 }]
    # The snapshot CronJob, writing the scrubbed dump into eesoc-snapshots.
    # Labelled in snapshot-cronjob.yaml; this patch is applied after the base's
    # commonLabels, so the selector is matched exactly as written.
    - from:
        - podSelector: { matchLabels: { app: snapshot } }
      ports: [{ port: 3900 }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ port: 3902 }]
    # snapshot.eesoc.com (snapshot-ingress.yaml): the ingress controller,
    # carrying staging's reads of the snapshot from the homelab. The Ingress
    # routes one exact path here and the edge vhost passes only GET and HEAD;
    # this rule is what lets the controller connect at all.
    #
    # The controller pod, not all of kube-system as for 3902. 3900 takes
    # credentials and can write, and kube-system holds plenty that has no
    # business on it. The base's reason for namespace-only selectors does not
    # apply here: this patch is applied after the base's commonLabels, so the
    # podSelector is matched exactly as written, as `app: snapshot` above is.
    # Both selectors are in one `from` entry, so they AND together. The label
    # is RKE2's bundled controller's, checked on this cluster (v1.13.5) and on
    # staging's.
    #
    # If the label ever stops matching, the controller's connections are
    # dropped, staging's fetch times out, and it restores its kept copy
    # instead. Nothing on eesoc.com depends on this rule.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: rke2-ingress-nginx }
      ports: [{ port: 3900 }]
---
# Garage's init sidecar creates the snapshot bucket and imports the read-only
# key staging authenticates with. Both are skipped when SNAPSHOT_BUCKET is
# unset, which is how staging's own Garage avoids growing a snapshot bucket it
# has nothing to put in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  template:
    spec:
      # `containers`, not `initContainers`: garage-init is a long-lived sidecar
      # that idles after setting up, because the Garage CLI needs the node key
      # from the pod's own volume.
      containers:
        - name: init
          env:
            - name: SNAPSHOT_BUCKET
              value: eesoc-snapshots
            - name: STAGING_RO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: eesoc-secrets
                  key: STAGING_RO_ACCESS_KEY_ID
                  optional: true
            - name: STAGING_RO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: eesoc-secrets
                  key: STAGING_RO_SECRET_ACCESS_KEY
                  optional: true
