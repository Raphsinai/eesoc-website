# Staging hostname. `spec.rules` has no patchMergeKey, so a strategic merge
# patch replaces the whole list rather than appending — the overlay states the
# complete set of hosts for this environment, and eesoc.com can never appear
# here by accident.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eesoc
spec:
  rules:
    - host: eesoc.raphsinai.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eesoc-media
spec:
  rules:
    - host: eesoc.raphsinai.dev
      http:
        paths:
          - path: /media/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: garage
                port:
                  number: 3902
