# Manual-only staging database refresh. Ordinary staging releases must NEVER
# invalidate sessions or discard testing data. This suspended CronJob is a
# reusable Job template, not a timed schedule or an ArgoCD hook.
#
# To deliberately replace staging's database with a scrubbed snapshot, run:
#   kubectl -n eesoc-staging create job --from=cronjob/refresh-from-production refresh-manual-$(date +%s)
# This explicitly DELETES staging sessions, test submissions and edits. The
# restore script also checks the actual pod namespace and database host so it
# cannot accidentally run against production.
#
# `schedule` is required by Kubernetes, but `suspend: true` means it will
# never schedule itself. The CI manifest gate enforces this property.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-from-production
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      # Deleted an hour after it finishes, so `kubectl get pods` is not a wall of
      # old refresh jobs, but the logs survive long enough to read after a deploy.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          # Admitted to staging Garage's S3 port by refresh-access.yaml.
          labels: { app: refresh }
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          volumes:
            - name: scratch
              emptyDir: {}
            - name: scripts
              configMap:
                name: snapshot-scripts
                defaultMode: 0755

          initContainers:
            # ---------------------------------------------------------------
            # 1. Fetch the snapshot, and the media it references.
            # ---------------------------------------------------------------
            - name: fetch
              image: rclone/rclone:1.68
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  SNAP=/scratch/snapshot.sql.gz
                  # Fail fast when production is not there.
                  QUICK="--contimeout 10s --timeout 60s --retries 1 --low-level-retries 2"

                  # The snapshot: production's, and a copy kept in staging's own
                  # Garage (garage-snapshot-cache.yaml) for the deploys that cannot
                  # reach production. Never in eesoc-media, which is public.
                  if [ -n "$RCLONE_CONFIG_PROD_ENDPOINT" ] && \
                     rclone copyto "prod:${SNAPSHOT_BUCKET}/latest.sql.gz" "$SNAP" \
                       --s3-no-check-bucket $QUICK; then
                    echo "fetched production's snapshot, $(wc -c < "$SNAP") bytes"
                    # Not fatal: garage-init may still be creating the bucket on
                    # the deploy that first adds it, and this restore is fine.
                    rclone copyto "$SNAP" "staging:${SNAPSHOT_BUCKET}/latest.sql.gz" \
                      --s3-no-check-bucket || echo "could not keep a copy this time"
                    FROM_PROD=1
                  else
                    echo "production's snapshot cannot be reached from this cluster;"
                    echo "restoring the copy staging kept (size, date taken):"
                    rclone lsl "staging:${SNAPSHOT_BUCKET}/latest.sql.gz" --s3-no-check-bucket
                    rclone copyto "staging:${SNAPSHOT_BUCKET}/latest.sql.gz" "$SNAP" \
                      --s3-no-check-bucket
                    FROM_PROD=0
                  fi

                  # Media. `copy`, never `sync`: sync deletes anything in the
                  # destination that is not in the source, which would wipe every
                  # file uploaded through the staging dashboard — the exact
                  # workflow staging exists to test. Both routes skip what staging
                  # already has, so after the first run only new objects move.
                  #
                  # Object storage here is public either way: these are event
                  # posters, sponsor logos and committee photos, already served
                  # anonymously from eesoc.com. Nothing private is ever written to
                  # this bucket.
                  if [ "$FROM_PROD" = 1 ]; then
                    rclone copy "prod:${MEDIA_BUCKET}" "staging:${MEDIA_BUCKET}" \
                      --s3-no-check-bucket --transfers 4
                  else
                    # Without production's bucket, fetch every object the snapshot
                    # refers to from eesoc.com/media, where they are public. Keys
                    # are random and never reused, so one that exists is current.
                    zcat "$SNAP" | grep -oE '/media/[A-Za-z0-9][A-Za-z0-9._/-]*' \
                      | sed 's#^/media/##' | sort -u > /scratch/media-keys
                    echo "$(wc -l < /scratch/media-keys) media objects referenced; fetching missing ones from ${PUBLIC_MEDIA_URL}"
                    # Not fatal: a stray "/media/..." in some text is not an object,
                    # and a missing poster is no reason to keep the old database.
                    rclone copy :http: "staging:${MEDIA_BUCKET}" \
                      --http-url "$PUBLIC_MEDIA_URL" --files-from /scratch/media-keys \
                      --no-traverse --ignore-existing --transfers 4 \
                      --s3-no-check-bucket --stats 0 \
                      || echo "some media could not be fetched; continuing"
                  fi
                  echo "media done"
              env:
                - { name: SNAPSHOT_BUCKET,  value: eesoc-snapshots }
                - { name: MEDIA_BUCKET,     value: eesoc-media }
                - { name: PUBLIC_MEDIA_URL, value: "https://eesoc.com/media/" }

                # Production, read-only. This key cannot write to either bucket.
                #
                # Empty: staging's cluster (deploy/homelab) has no route to
                # production's Garage, which was "http://garage.eesoc.svc.cluster.local:3900"
                # while both shared a cluster. Empty skips straight to staging's
                # kept copy. deploy/homelab/README.md ("Data") says what a route
                # would take; it is a production change.
                - { name: RCLONE_CONFIG_PROD_TYPE,     value: s3 }
                - { name: RCLONE_CONFIG_PROD_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_PROD_ENDPOINT, value: "" }
                - { name: RCLONE_CONFIG_PROD_REGION,   value: garage }
                - name: RCLONE_CONFIG_PROD_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: eesoc-secrets, key: PROD_RO_ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_PROD_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: eesoc-secrets, key: PROD_RO_SECRET_ACCESS_KEY } }

                # Staging's own Garage, where the media lands and the snapshot is kept.
                - { name: RCLONE_CONFIG_STAGING_TYPE,     value: s3 }
                - { name: RCLONE_CONFIG_STAGING_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_STAGING_ENDPOINT, value: "http://garage:3900" }
                - { name: RCLONE_CONFIG_STAGING_REGION,   value: garage }
                - name: RCLONE_CONFIG_STAGING_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: eesoc-secrets, key: S3_ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_STAGING_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: eesoc-secrets, key: S3_SECRET_ACCESS_KEY } }
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 512Mi }

            # ---------------------------------------------------------------
            # 2. Replace staging's database with it.
            # ---------------------------------------------------------------
            - name: restore
              image: ghcr.io/cloudnative-pg/postgresql:16.4
              command: ["bash", "/snapshot/restore.sh"]
              env:
                - name: SNAPSHOT
                  value: /scratch/snapshot.sql.gz
                # restore.sh refuses to run unless BOTH of these say staging. It
                # issues a DROP SCHEMA, so the cost of it ever pointing at the
                # wrong database is the live site.
                - name: ENVIRONMENT
                  valueFrom: { configMapKeyRef: { name: eesoc-config, key: ENVIRONMENT } }
                # From the Downward API: what Kubernetes says this pod is, which a
                # copied manifest cannot lie about.
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: PGHOST
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: host } }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: password } }
                - name: PGDATABASE
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: dbname } }
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: scripts, mountPath: /snapshot, readOnly: true }
              resources:
                requests: { cpu: 100m, memory: 192Mi }
                limits:   { memory: 512Mi }

          containers:
            # ---------------------------------------------------------------
            # 3. Bring the restored schema up to staging's code.
            # ---------------------------------------------------------------
            # The snapshot is production's schema, which lags staging's by whatever
            # is waiting to be promoted. Migrations only run when the adapter
            # starts, and it started BEFORE this restore replaced the schema — so
            # without this step staging runs new code on the old schema. Same
            # image as staging's adapter, same runner, so it applies exactly the
            # numbers production has not got yet and nothing else.
            - name: migrate
              image: ghcr.io/OWNER/eesoc-database
              command:
                - python
                - -c
                - |
                  import asyncio, os, asyncpg, migrate
                  async def main():
                      conn = await asyncpg.connect(
                          host=os.environ["PG_HOST"], port=os.environ["PG_PORT"],
                          user=os.environ["PG_USER"], password=os.environ["PG_PASS"],
                          database=os.environ["PG_DB"])
                      try:
                          await migrate.backfill_existing(conn)
                          print("[migrate]", await migrate.run(conn))
                      finally:
                          await conn.close()
                  asyncio.run(main())
              env:
                - name: PG_HOST
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: host } }
                - name: PG_PORT
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: port } }
                - name: PG_DB
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: dbname } }
                - name: PG_USER
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: username } }
                - name: PG_PASS
                  valueFrom: { secretKeyRef: { name: eesoc-db-app, key: password } }
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits:   { memory: 256Mi }
