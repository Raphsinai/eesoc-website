# eesoc.com — the EESoc site.
#
# TLS terminates here; the hop into the cluster is plain HTTP. The cluster
# Ingress matches on Host, so the header is passed through unchanged —
# rewriting it would break canonical URLs and the /media bucket routing.
#
# The certificate covers eesoc.com only, not www. www has no DNS record, so it
# is redirected on :80 and never served over TLS; add it to the certificate
# before pointing www at this box.

upstream eesoc_com_cluster {
    server 172.16.16.129:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name eesoc.com www.eesoc.com;

    # Renewals come in over plain HTTP on this name, and this vhost now owns
    # it — without this they would hit the redirect below and the certificate
    # would quietly stop renewing in 90 days. Same target the catch-all uses.
    location /.well-known/acme-challenge/ {
        proxy_pass http://172.16.16.181:80;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 301 https://eesoc.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eesoc.com;

    ssl_certificate     /etc/letsencrypt/live/eesoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eesoc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads are capped at 10 MB by the application; leave headroom for
    # multipart overhead, or nginx rejects them here with a 413 that never
    # reaches Python and never shows the app's own message.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    access_log /var/log/nginx/eesoc.com.access.log;
    error_log  /var/log/nginx/eesoc.com.error.log;

    location / {
        proxy_pass http://eesoc_com_cluster;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app rate-limits sign-in codes on the FIRST hop of this header,
        # which behind Cloudflare is the real visitor rather than the proxy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
