# eesoc.com — the EESoc site.
#
# TLS terminates here; the hop into the cluster is plain HTTP. The cluster
# Ingress matches on Host, so the header is passed through unchanged —
# rewriting it would break canonical URLs and the /media bucket routing.
#
# The certificate covers both eesoc.com and www.eesoc.com. www is redirected
# to the apex rather than serving a second copy of the site — but it has to be
# redirected over TLS as well as plain HTTP: Cloudflare is on Full (strict),
# so it opens an HTTPS connection to the origin with SNI www.eesoc.com, and
# without a server block for that name nginx answers from the default vhost
# with somebody else's certificate and Cloudflare returns 526.

upstream eesoc_com_cluster {
    server 172.16.16.129:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name eesoc.com www.eesoc.com;

    # No acme-challenge proxy here on purpose. The catch-all forwards that
    # path to 172.16.16.181, which refuses connections, and copying it would
    # have broken renewal in 90 days. This certificate renews through
    # certbot's nginx authenticator (see /etc/letsencrypt/renewal/eesoc.com
    # .conf), which serves the challenge from this server block itself.

    location / {
        return 301 https://eesoc.com$request_uri;
    }
}

server {
    # http2 on the listen line, not the standalone `http2 on;` directive —
    # that one is nginx 1.25.1+ and this box runs 1.18, where it is an
    # "unknown directive" and the config will not load at all.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eesoc.com;

    ssl_certificate     /etc/letsencrypt/live/eesoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eesoc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads are capped at 10 MB by the application; leave headroom for
    # multipart overhead, or nginx rejects them here with a 413 that never
    # reaches Python and never shows the app's own message.
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    access_log /var/log/nginx/eesoc.com.access.log;
    error_log  /var/log/nginx/eesoc.com.error.log;

    location / {
        proxy_pass http://eesoc_com_cluster;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app rate-limits sign-in codes on the FIRST hop of this header,
        # which behind Cloudflare is the real visitor rather than the proxy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eesoc.com;

    ssl_certificate     /etc/letsencrypt/live/eesoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eesoc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eesoc.com$request_uri;
}
