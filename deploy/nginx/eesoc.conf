# Edge reverse proxy for eesoc.com — runs on the VM in front of the cluster.
#
# TLS stops here. The hop into the cluster is plain HTTP, so the Kubernetes
# Ingress carries no certificate.
#
#   browser ──HTTPS──> this VM ──HTTP──> cluster ingress ──> frontend ──> api
#
# Install:
#   /etc/nginx/sites-available/eesoc.conf  (symlink into sites-enabled)
#   certbot --nginx -d eesoc.com -d www.eesoc.com
#   nginx -t && systemctl reload nginx

# Where the cluster ingress can be reached. A LoadBalancer IP, a NodePort on a
# node, or a MetalLB address.
upstream eesoc_cluster {
    server 10.0.0.50:80;

    # Reuse connections: without this every request pays a fresh TCP handshake
    # to the cluster.
    keepalive 32;
}

# Redirect plain HTTP to HTTPS. Certbot's ACME challenge is served from here, so
# the location block below must come before the catch-all redirect.
server {
    listen      80;
    listen      [::]:80;
    server_name eesoc.com www.eesoc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name eesoc.com www.eesoc.com;

    # ---- TLS (certbot writes these) ----
    ssl_certificate     /etc/letsencrypt/live/eesoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eesoc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---- Security headers ----
    # HSTS belongs here, not in the cluster: this is the only hop the browser
    # actually speaks TLS to. Start with a short max-age and raise it once you
    # are confident — the header is hard to walk back, since browsers cache it.
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # Uploads are capped at 10 MB in the application; leave room for multipart
    # overhead. Too low here and a large committee photo fails with a confusing
    # 413 from nginx rather than the application's own message.
    client_max_body_size 12m;

    # ---- Logging ----
    access_log /var/log/nginx/eesoc.access.log;
    error_log  /var/log/nginx/eesoc.error.log;

    location / {
        proxy_pass http://eesoc_cluster;

        # Host is passed through unchanged so the Ingress host rule matches and
        # the application builds correct absolute URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # The application reads this to know the browser is on HTTPS even though
        # this hop is not. Login-code rate limiting keys off X-Forwarded-For, so
        # both matter.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_http_version 1.1;
        # Required for keepalive to the upstream.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Do not buffer the whole response before sending it on; the API returns
        # some large JSON (the module-feedback tree is ~300 KB).
        proxy_buffering off;
    }

    # Uploaded files are served from object storage, not from here — nothing to
    # proxy. If you ever point S3_PUBLIC_BASE_URL at this host instead of a CDN,
    # add a location for it.
}
