# eesoc.raphsinai.dev — temporary host for the EESoc site while eesoc.com is
# still served by the old provider.
#
# TLS terminates here; the hop into the cluster is plain HTTP. The cluster
# Ingress matches on Host, so the header is passed through unchanged — rewriting
# it would break canonical URLs and the /media bucket routing.
#
# Written HTTP-only to begin with: certbot cannot issue a certificate until the
# name resolves here. Once Cloudflare points at this box, run
#   sudo certbot --nginx -d eesoc.raphsinai.dev
# and certbot will add the 443 server block and the redirect itself.

upstream eesoc_cluster {
    server 172.16.16.129:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name eesoc.raphsinai.dev;

    # Uploads are capped at 10 MB by the application; leave headroom for
    # multipart overhead, or nginx rejects them here with a 413 that never
    # reaches Python and never shows the app's own message.
    client_max_body_size 12m;

    access_log /var/log/nginx/eesoc.access.log;
    error_log  /var/log/nginx/eesoc.error.log;

    location / {
        proxy_pass http://eesoc_cluster;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app takes the FIRST hop of this header to rate-limit sign-in
        # codes. Behind Cloudflare that is the real visitor, which is what
        # makes the limit per-person rather than per-proxy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hardcoded, not $scheme: the browser is always on HTTPS, whether that
        # is terminated by Cloudflare or by this server. The app's session
        # cookie is Secure, and telling it the request was HTTP would be a lie
        # that only causes confusion in logs and redirects.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
