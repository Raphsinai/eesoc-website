# eesoc.raphsinai.dev — the STAGING site.
#
# Same edge VM as eesoc.com, pointing at the same cluster ingress; the two are
# separated by Host, which the ingress matches against the staging overlay's
# rules and so lands in the eesoc-staging namespace. Rewriting the Host here
# would send staging traffic to production's Ingress — it is the only thing
# keeping them apart at this hop.
#
# TLS terminates here; the hop into the cluster is plain HTTP.
#
# Install:
#   cp deploy/nginx/eesoc.raphsinai.dev.conf \
#      /etc/nginx/sites-available/eesoc.raphsinai.dev
#   ln -s /etc/nginx/sites-available/eesoc.raphsinai.dev /etc/nginx/sites-enabled/
#   certbot --nginx -d eesoc.raphsinai.dev
#   nginx -t && systemctl reload nginx

upstream eesoc_staging_cluster {
    server 172.16.16.129:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name eesoc.raphsinai.dev;

    location / {
        return 301 https://eesoc.raphsinai.dev$request_uri;
    }
}

server {
    # http2 on the listen line, not the standalone `http2 on;` directive —
    # that one is nginx 1.25.1+ and this box runs 1.18, where it is an
    # "unknown directive" and the config will not load at all.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eesoc.raphsinai.dev;

    ssl_certificate     /etc/letsencrypt/live/eesoc.raphsinai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eesoc.raphsinai.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads are capped at 10 MB by the application; leave headroom for
    # multipart overhead, or nginx rejects them here with a 413 that never
    # reaches Python and never shows the app's own message.
    client_max_body_size 12m;

    # ─── THE LINE THAT MAKES THIS STAGING ───────────────────────────────────
    # Staging serves the same pages as eesoc.com. Indexed, it would compete
    # with production in search results for the society's own name, and send
    # real students to a site whose database is wiped whenever it suits us.
    #
    # Set at the edge rather than in the app so it covers everything the
    # cluster serves — HTML, sitemap.xml, uploaded media — and cannot be
    # forgotten in a new route. `always` so it survives error responses too.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    access_log /var/log/nginx/eesoc.staging.access.log;
    error_log  /var/log/nginx/eesoc.staging.error.log;

    location / {
        proxy_pass http://eesoc_staging_cluster;
        proxy_redirect off;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The app rate-limits sign-in codes on the FIRST hop of this header,
        # which behind Cloudflare is the real visitor rather than the proxy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hardcoded, not $scheme: the browser is always on HTTPS, whether that
        # is terminated by Cloudflare or by this server. The session cookie is
        # Secure, and telling the app the request was HTTP would be a lie that
        # only causes confusion in logs and redirects.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
