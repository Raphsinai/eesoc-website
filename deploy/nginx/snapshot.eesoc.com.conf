# snapshot.eesoc.com — staging's read-only path to production's snapshot.
#
# Staging runs on its own cluster on the homelab (deploy/homelab). After every
# deploy its refresh job restores a scrubbed copy of production: one object,
# eesoc-snapshots/latest.sql.gz in production Garage's private bucket, read over
# Garage's S3 API with a key that Garage lets read and nothing else.
#
# The S3 API can write, so this vhost passes exactly one kind of request and
# refuses everything else before it reaches the cluster:
#
#   GET or HEAD /eesoc-snapshots/latest.sql.gz, signed, no query string
#
# Even production's own read/write key cannot upload, delete or list through
# here. The cluster's Ingress (overlays/production/snapshot-ingress.yaml) routes
# that same exact path and nothing else, so both would have to be widened before
# anything more of Garage was reachable.
#
# Needs the eesoc_com_cluster upstream from eesoc.com.conf, which sorts first in
# sites-enabled. Install it the same way, with its own certificate, so removing
# this name later leaves eesoc.com's certificate alone:
#
#   cp deploy/nginx/snapshot.eesoc.com.conf /etc/nginx/sites-available/snapshot.eesoc.com
#   ln -s /etc/nginx/sites-available/snapshot.eesoc.com /etc/nginx/sites-enabled/
#   certbot --nginx -d snapshot.eesoc.com
#   nginx -t && systemctl reload nginx
#
# The DNS record is a proxied CNAME to eesoc.com in Cloudflare, so the origin's
# address stays unpublished, as for eesoc.com.

server {
    listen 80;
    listen [::]:80;
    server_name snapshot.eesoc.com;

    # certbot's nginx authenticator answers the ACME challenge from this block
    # with an exact-match location of its own, which wins over this one.
    # Nothing else is served over plain HTTP: a signed request has no reason to
    # come here, and a redirect would only send it round again.
    location / {
        return 403;
    }
}

server {
    # http2 on the listen line: this box runs nginx 1.18 (see eesoc.com.conf).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name snapshot.eesoc.com;

    ssl_certificate     /etc/letsencrypt/live/snapshot.eesoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snapshot.eesoc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/snapshot.eesoc.com.access.log;
    error_log  /var/log/nginx/snapshot.eesoc.com.error.log;

    # Nothing is uploaded through here.
    client_max_body_size 1k;

    # Never cached, anywhere. Cloudflare caches .gz by file extension unless
    # the origin says not to, and a cached copy goes to whoever asks for that
    # URL next, signed or not. no-store is what stops the dump turning into an
    # anonymous download from Cloudflare's edge. The upstream's own
    # Cache-Control, if an object ever carries one, is dropped first so this is
    # the only one.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /eesoc-snapshots/latest.sql.gz {
        # GET also allows HEAD, which rclone sends first.
        limit_except GET {
            deny all;
        }
        # Unsigned requests never reach Garage. rclone signs in the
        # Authorization header.
        if ($http_authorization = "") {
            return 403;
        }
        # HeadObject takes no query string, and GetObject only the one rclone's
        # S3 library adds to name the operation. Anything else on this path is
        # a different S3 operation (?acl, ?tagging, ?uploadId=...), or a
        # presigned URL, which nothing here uses.
        if ($args !~ "^(x-id=GetObject)?$") {
            return 403;
        }

        proxy_pass http://eesoc_com_cluster;
        proxy_redirect off;
        proxy_http_version 1.1;

        # Host passes through unchanged: the request is signed over it, and
        # Garage rejects one whose Host differs from what the client signed.
        proxy_set_header Host              $host;
        # Set, not passed through. The cluster's ingress controller trusts
        # forwarded headers (use-forwarded-headers) and sends
        # X-Forwarded-Host upstream as Host when there is one, so a client's
        # own value would otherwise reach Garage in place of this one.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location / {
        return 403;
    }
}
