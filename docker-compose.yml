# EESoc website — frontend + backend.
#
#   docker compose up --build        # start everything
#   docker compose up --build api    # one service and its dependencies
#   docker compose logs -f api       # tail one service
#   docker compose down              # stop, keeping the database
#   docker compose down -v           # stop and WIPE the database volume
#
# Then open http://localhost:8080
#
# The frontend (nginx) proxies /api to the api service so they share an origin —
# no CORS, and session cookies work without SameSite=None. The backend services
# live in backend/compose.yaml, included below.

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: the SPA calls /api, nginx proxies it to `api`.
        VITE_API_BASE: /api
    image: eesoc-website-frontend
    # No env_file: this is a static nginx image. VITE_API_BASE is a BUILD arg —
    # Vite inlines it into the bundle, so there is nothing to configure at run
    # time. To change it: docker compose build --build-arg VITE_API_BASE=... frontend
    volumes:
      # Serve uploaded files straight off the volume — an image request never
      # touches Python.
      - media:/usr/share/nginx/media:ro
    ports:
      - "8080:80"
    depends_on:
      # nginx resolves `api` at startup and refuses to boot if the name is
      # unknown, so the container must exist before nginx does.
      api:
        condition: service_started

volumes:
  media:
    name: eesoc-website_media
    external: false

include:
  - backend/compose.yaml
