server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Uploads are capped at 10 MB by the application. nginx defaults to 1m, so
    # without this every larger upload dies here with a 413 that never reaches
    # Python — and the app's own limit and error message never apply. This runs
    # in front of /api in both compose and the cluster, so the ingress
    # annotation alone is not enough.
    client_max_body_size 12m;

    # ---- Compression ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Basic hardening. Set at server scope so it applies to every response.
    # NOTE: an `add_header` inside a location resets ALL inherited
    # add_headers, so any location that sets its own Cache-Control (like
    # /assets/ below) must REPEAT these three security headers, or they
    # silently disappear from that location's responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- Hashed build assets: cache hard (filenames change on rebuild) ----
    # Filenames are content-hashed, so immutable caching is safe: a changed
    # file gets a new name and therefore a fresh cache entry. `immutable`
    # matters here — it stops even a manual revalidation of a chunk an old
    # tab still needs (after a deploy the server keeps old chunks around,
    # see the Dockerfile, and revalidating them would only ever confirm
    # they are unchanged). The security headers are repeated inside this
    # location because an add_header here resets the inherited ones (see
    # the note at server scope).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---- Never cache the app shell, so new deploys are picked up ----
    # A reload must always revalidate this file: it is the entry point that
    # references the current hashed assets, and the chunk-recovery hook
    # (src/chunk-recovery.js) relies on a fresh index.html after a reload.
    location = /index.html {
        expires -1;                # → Cache-Control: no-cache
    }

    # ---- SPA history-mode routing: everything else falls back to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Uploaded files, served off the shared media volume ----
    # Never proxied through the api: serving an image should not occupy a
    # Python worker. `nosniff` from the server block still applies, and the
    # upload allow-list keeps SVG out, so nothing here is script-executable.
    location /media/ {
        alias       /usr/share/nginx/media/;
        expires     30d;
        # `always` matters here: a plain add_header is only emitted on 2xx/3xx,
        # and this location's own 404s (a deleted or typo'd upload URL) would
        # otherwise leave the response with no Cache-Control at all, making the
        # client re-request the dead URL forever. Pinned by the section-03
        # header suite (tests/spa-assets).
        add_header  Cache-Control "public, max-age=2592000" always;
        add_header  X-Content-Type-Options "nosniff" always;
        try_files   $uri =404;
    }

    # ---- robots + sitemap ----
    # Generated by the api, because the URLs worth listing (events, resource
    # pages) are database rows — a static file would be stale immediately.
    location = /robots.txt  { proxy_pass http://api:8080/robots.txt;  proxy_set_header Host $host; }
    location = /sitemap.xml { proxy_pass http://api:8080/sitemap.xml; proxy_set_header Host $host; }

    # ---- Backend API (same-origin, avoids CORS) ----
    # The app calls VITE_API_BASE (default "/api"). `api` is the compose service
    # name; nginx resolves it at startup, which is why the frontend service
    # declares depends_on: api.
    location /api/ {
        proxy_pass         http://api:8080/;   # trailing slash strips the /api prefix
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
